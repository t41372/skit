[workspace]
members = ["crates/skit-core", "crates/skit-tui", "crates/skit"]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/t41372/skit"

[workspace.dependencies]
atomic-write-file = "=0.3.0"
clap = { version = "=4.6.6", features = ["derive"] }
crossterm = "=0.29.0"
ratatui = "=0.30.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=1.1.4"
tempfile = "=3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
