[workspace]
resolver = "3"
members = [
    "crates/skit-i18n",
    "crates/skit-domain",
    "crates/skit-application",
    "crates/skit-language",
    "crates/skit-form",
    "crates/skit-store",
    "crates/skit-runtime",
    "crates/skit-ui",
    "crates/skit-tui",
    "crates/skit-cli",
]
default-members = ["crates/skit-cli"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
authors = ["Yi-Ting Chiu <mytim710@gmail.com>"]
repository = "https://github.com/t41372/skit"

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
glob = "0.3.4"
ratatui-core = { version = "0.1.2", features = ["std", "layout-cache"] }
ratatui-widgets = { version = "0.3.2", default-features = false, features = ["std"] }
ratatui-crossterm = "0.1.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shlex = "2.0.1"
thiserror = "2.0.19"
time = { version = "0.3.55", features = ["formatting", "local-offset"] }
toml = "1.1.4"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
unicode-width = "0.2.2"

assert_cmd = "2.2.2"
predicates = "3.1.4"
proptest = "1.11.0"
tempfile = "3.27.0"

skit-domain = { path = "crates/skit-domain" }
skit-i18n = { path = "crates/skit-i18n" }
skit-application = { path = "crates/skit-application" }
skit-language = { path = "crates/skit-language" }
skit-form = { path = "crates/skit-form" }
skit-store = { path = "crates/skit-store" }
skit-runtime = { path = "crates/skit-runtime" }
skit-ui = { path = "crates/skit-ui" }
skit-tui = { path = "crates/skit-tui" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
