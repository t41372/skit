[workspace]
resolver = "3"
members = [
    "crates/skit-i18n",
    "crates/skit-domain",
    "crates/skit-application",
    "crates/skit-language",
    "crates/skit-form",
    "crates/skit-store",
    "crates/skit-runtime",
    "crates/skit-ui",
    "crates/skit-tui",
    "crates/skit-cli",
    "crates/skit-benchmarks",
]
default-members = ["crates/skit-cli"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
authors = ["Yi-Ting Chiu <mytim710@gmail.com>"]
repository = "https://github.com/t41372/skit"

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = { version = "4.6.9", features = ["unstable-dynamic"] }
glob = "0.3.4"
flate2 = "1.1.9"
pep440_rs = "0.7.3"
pep508_rs = "0.9.2"
ratatui-core = { version = "0.1.2", features = ["std", "layout-cache"] }
ratatui-widgets = { version = "0.3.2", default-features = false, features = ["std"] }
ratatui-crossterm = "0.1.2"
regex = "1.13.1"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
shlex = "2.0.1"
syn = { version = "2.0.119", features = ["full", "visit"] }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "local-offset", "parsing"] }
toml = "1.1.4"
toml_edit = "0.25.13"
tree-sitter = "0.26.12"
tree-sitter-bash = "0.25.1"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-typescript = "0.23.2"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
unicode-width = "0.2.2"
codspeed-criterion-compat = "5.0.1"

assert_cmd = "2.2.2"
predicates = "3.1.4"
portable-pty = "0.9.0"
proptest = "1.11.0"
tempfile = "3.27.0"
tar = "0.4.46"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

skit-domain = { version = "0.5.0", path = "crates/skit-domain" }
skit-i18n = { version = "0.5.0", path = "crates/skit-i18n" }
skit-application = { version = "0.5.0", path = "crates/skit-application" }
skit-language = { version = "0.5.0", path = "crates/skit-language" }
skit-form = { version = "0.5.0", path = "crates/skit-form" }
skit-store = { version = "0.5.0", path = "crates/skit-store" }
skit-runtime = { version = "0.5.0", path = "crates/skit-runtime" }
skit-ui = { version = "0.5.0", path = "crates/skit-ui" }
skit-tui = { version = "0.5.0", path = "crates/skit-tui" }
skit-benchmarks = { version = "0.5.0", path = "crates/skit-benchmarks" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
