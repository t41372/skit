[workspace]
members = ["crates/skit-core"]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/t41372/skit"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.3"
tempfile = "=3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
