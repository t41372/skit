name: Docs site

# Build the Fumadocs documentation site and deploy it to GitHub Pages from main.
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - '!docs/assets/**'
      - '!docs/design/**'
      - README.md
      - README.zh-CN.md
      - README.zh-TW.md
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - '!docs/assets/**'
      - '!docs/design/**'
      - README.md
      - README.zh-CN.md
      - README.zh-TW.md
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install the documented npm release
        # npm cannot install itself from package-lock.json. Pin the only package and version.
        run: npm install --global npm@12.2.2 # zizmor: ignore[adhoc-packages]
      - name: Install dependencies
        run: npm ci
        working-directory: docs
      - name: Type check
        run: npm run types:check
        working-directory: docs
      - name: Build static site
        run: npm run build
        working-directory: docs
      - name: Upload Pages artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/out

  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
