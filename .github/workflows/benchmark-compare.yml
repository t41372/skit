name: benchmark (compare)

# On-demand A/B: the evidence tool optimization PRs cite (docs/design/benchmarks.md).
on:
  workflow_dispatch:
    inputs:
      base:
        description: "Base ref (branch, tag, or SHA)"
        required: true
      head:
        description: "Head ref (branch, tag, or SHA)"
        required: true

permissions: {}

concurrency:
  group: benchmark-compare-${{ github.event.inputs.base }}-${{ github.event.inputs.head }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  BENCH_CI_RUNNER: ubuntu-24.04

jobs:
  compare:
    name: A/B (${{ inputs.base }} vs ${{ inputs.head }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout harness (this ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base }}
          path: side-base
          persist-credentials: false
      - name: Checkout head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head }}
          path: side-head
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14.6"
          enable-cache: true
          prune-cache: true
      - name: Sync harness dependencies
        run: uv sync --dev
      - name: Install hyperfine (pinned)
        uses: ./.github/actions/install-hyperfine
      - name: Build base venv + run
        run: |
          uv sync --directory side-base --no-default-groups
          uv pip install --python side-base/.venv/bin/python "pyperf==2.10.0"
          side-base/.venv/bin/python -m benchmarks run --profile compare --out .bench-base --measured-repo side-base
      - name: Build head venv + run
        run: |
          uv sync --directory side-head --no-default-groups
          uv pip install --python side-head/.venv/bin/python "pyperf==2.10.0"
          side-head/.venv/bin/python -m benchmarks run --profile compare --out .bench-head --measured-repo side-head
      - name: Render comparison
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          uv run python -m benchmarks compare .bench-base/results.json .bench-head/results.json \
            | tee comparison.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-compare
          include-hidden-files: true
          path: |
            comparison.md
            .bench-base/results.json
            .bench-base/results.md
            .bench-head/results.json
            .bench-head/results.md
          retention-days: 90
