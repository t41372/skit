name: benchmark (compare)

on:
  workflow_dispatch:
    inputs:
      base:
        description: "Base ref"
        required: true
      head:
        description: "Head ref"
        required: true

permissions: {}

concurrency:
  group: benchmark-compare-${{ github.event.inputs.base }}-${{ github.event.inputs.head }}
  cancel-in-progress: false

jobs:
  compare:
    name: A/B (${{ inputs.base }} vs ${{ inputs.head }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out the harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base }}
          path: side-base
          persist-credentials: false
      - name: Check out the head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head }}
          path: side-head
          persist-credentials: false
      - name: Install hyperfine
        uses: ./.github/actions/install-hyperfine
      - name: Build both refs
        run: cargo build --locked --release --manifest-path side-base/Cargo.toml -p skit-cli-rs && cargo build --locked --release --manifest-path side-head/Cargo.toml -p skit-cli-rs
      - name: Measure the base
        env:
          SKIT_BENCH_REPO: side-base
        run: bash benchmarks/run.sh compare .bench-base side-base/target/release/skit
      - name: Measure the head
        env:
          SKIT_BENCH_REPO: side-head
        run: bash benchmarks/run.sh compare .bench-head side-head/target/release/skit
      - name: Render the comparison
        run: bash benchmarks/compare.sh .bench-base/results.json .bench-head/results.json | tee comparison.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload A/B evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-compare
          include-hidden-files: true
          path: |
            comparison.md
            .bench-base/
            .bench-head/
          retention-days: 90
