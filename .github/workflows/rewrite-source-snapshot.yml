name: Rewrite source snapshot

on:
  push:
    branches:
      - rewrite/rust-ratatui-gpt56
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: rewrite-source-snapshot-gpt56
  cancel-in-progress: true

jobs:
  snapshot:
    name: Package repository snapshot
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=skit-source.tar.gz HEAD
          sha256sum skit-source.tar.gz > skit-source.tar.gz.sha256
      - name: Upload source archive
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skit-source-${{ github.sha }}
          path: |
            skit-source.tar.gz
            skit-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Publish snapshot coordinates
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(printf '{\"state\":\"success\",\"context\":\"rewrite/source-snapshot\",\"description\":\"run=%s artifact=%s\",\"target_url\":\"https://github.com/%s/actions/runs/%s\"}' "$GITHUB_RUN_ID" "$ARTIFACT_ID" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
