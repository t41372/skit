name: Path onboarding oracle probe

on:
  pull_request:
    paths:
      - .github/workflows/path-onboarding-oracle-probe.yml
      - crates/skit-domain/tests/port_test_path_type.rs
      - crates/skit-language/tests/port_test_path_reconcile.rs
      - crates/skit-form/tests/port_test_onboarding_cli.rs

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run path and onboarding oracles
        shell: bash
        run: |
          set +e
          cargo test --locked -p skit-domain --test port_test_path_type -- --nocapture
          echo "PATH_TYPE_RC=$?"
          cargo test --locked -p skit-language --test port_test_path_reconcile -- --nocapture
          echo "PATH_RECONCILE_RC=$?"
          cargo test --locked -p skit-form --test port_test_onboarding_cli -- --nocapture
          echo "ONBOARDING_CLI_RC=$?"
          exit 0
