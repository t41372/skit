name: CodSpeed

on:
  push:
    branches: [main]
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", "benchmarks/**", ".github/workflows/codspeed.yml"]
  pull_request:
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", "benchmarks/**", ".github/workflows/codspeed.yml"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: codspeed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmarks:
    name: Run Rust benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-codspeed
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-codspeed@6.0.0
      - name: Build instrumented benchmarks
        run: cargo codspeed build -m simulation --locked --workspace --all-features
      - name: Run benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: simulation
          run: cargo codspeed run --workspace
