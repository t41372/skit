name: CodSpeed

# Continuous performance measurement with CodSpeed. Benchmarks live in
# benchmarks/codspeed/ (pytest-codspeed, simulation mode) and are separate from the
# existing pyperf pipeline (benchmarks/) and the pytest suite (tests/). Advisory by
# policy — a red run here is visible signal, never a merge lock.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'benchmarks/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/codspeed.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'benchmarks/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/codspeed.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: codspeed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: "1"

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14.6"
          enable-cache: true
          prune-cache: true
      - name: Sync dependencies
        run: uv sync --dev
      - name: Run benchmarks
        uses: CodSpeedHQ/action@f99becdce5e5d51fd556489ebef684f4ecfd6286 # v4.18.5
        with:
          mode: simulation
          run: uv run pytest benchmarks/codspeed/ --codspeed -o testpaths=benchmarks/codspeed
