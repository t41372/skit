name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:
  # workflow_dispatch lets CodSpeed trigger a backtest run to seed baseline data.
  workflow_dispatch:

# Grant no permissions by default; the benchmark job requests only what it needs
# (zizmor: excessive-permissions).
permissions: {}

concurrency:
  group: codspeed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# skit is a UTF-8 TUI; force Python UTF-8 mode so captured stdout under pytest can always
# encode the box-drawing/arrow frames (mirrors the main CI workflow).
env:
  PYTHONUTF8: "1"

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OpenID Connect authentication with CodSpeed
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --dev
      - name: Run benchmarks
        uses: CodSpeedHQ/action@f99becdce5e5d51fd556489ebef684f4ecfd6286 # v4.18.5
        with:
          mode: simulation
          run: uv run pytest benchmarks/ --codspeed
