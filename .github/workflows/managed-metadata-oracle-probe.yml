name: Managed metadata oracle probe

on:
  pull_request:
    paths:
      - .github/workflows/managed-metadata-oracle-probe.yml
      - crates/skit-language/tests/port_test_managed_metadata.rs

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run managed metadata oracle
        shell: bash
        run: |
          set +e
          cargo test --locked -p skit-language --test port_test_managed_metadata -- --nocapture
          rc=$?
          echo "MANAGED_METADATA_ORACLE_RC=$rc"
          exit 0
