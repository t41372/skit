name: Source injection oracle probe

# Temporary self-trigger; deleted after diagnostics are read.
on:
  push:
    branches:
      - agent/port-python-test-contracts-v3
    paths:
      - .github/workflows/source-injection-oracle-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/port-python-test-contracts-v3
          persist-credentials: true
      - name: Format and run source injection oracles
        shell: bash
        run: |
          set +e
          files=(
            crates/skit-language/tests/port_test_javascript_injection_mut.rs
            crates/skit-language/tests/port_test_shell_injection_mut.rs
          )
          rustfmt --edition 2024 "${files[@]}" > /tmp/inject-format.log 2>&1
          format_rc=$?
          rustfmt --edition 2024 --check "${files[@]}" > /tmp/inject-rustfmt.log 2>&1
          rustfmt_rc=$?
          cargo test --locked -p skit-cli-rs --test port_test_strength_gate -- --nocapture > /tmp/inject-strength.log 2>&1
          strength_rc=$?
          cargo test --locked -p skit-language --test port_test_javascript_injection_mut -- --nocapture --test-threads=1 > /tmp/inject-js.log 2>&1
          js_rc=$?
          cargo test --locked -p skit-language --test port_test_shell_injection_mut -- --nocapture --test-threads=1 > /tmp/inject-shell.log 2>&1
          shell_rc=$?

          result=crates/skit-cli/tests/source_injection_oracle_probe_result.txt
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "FORMAT_RC=$format_rc"
            echo "RUSTFMT_RC=$rustfmt_rc"
            echo "STRENGTH_GATE_RC=$strength_rc"
            echo "JS_INJECTION_RC=$js_rc"
            echo "SHELL_INJECTION_RC=$shell_rc"
            for pair in \
              "format:$format_rc:/tmp/inject-format.log" \
              "rustfmt:$rustfmt_rc:/tmp/inject-rustfmt.log" \
              "strength:$strength_rc:/tmp/inject-strength.log" \
              "js:$js_rc:/tmp/inject-js.log" \
              "shell:$shell_rc:/tmp/inject-shell.log"
            do
              IFS=: read -r label rc log <<< "$pair"
              if [ "$rc" -ne 0 ]; then
                echo
                echo "===== $label failure log ====="
                cat "$log"
              fi
            done
          } > "$result"

          git add -- "${files[@]}" "$result"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git diff --cached --quiet; then
            git commit -m "test(port): format and record source injection probe"
            git push origin HEAD:agent/port-python-test-contracts-v3
          fi
          exit 0
