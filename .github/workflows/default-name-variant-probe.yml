name: Default name variant probe

on:
  push:
    branches:
      - agent/port-python-test-contracts-v3
    paths:
      - .github/workflows/default-name-variant-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/port-python-test-contracts-v3
          persist-credentials: true
      - name: Run additive parametrized rows
        shell: bash
        run: |
          set +e
          file=crates/skit-form/tests/port_test_default_name_resolution_variants.rs
          rustfmt --edition 2024 "$file"
          format_rc=$?
          rustfmt --edition 2024 --check "$file"
          rustfmt_rc=$?
          cargo test --locked -p skit-form --test port_test_default_name_resolution_variants -- --nocapture --test-threads=1 > /tmp/variants.log 2>&1
          tests_rc=$?
          result=crates/skit-cli/tests/default_name_variant_probe_result.txt
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "FORMAT_RC=$format_rc"
            echo "RUSTFMT_RC=$rustfmt_rc"
            echo "VARIANT_TEST_RC=$tests_rc"
            grep -E '^test result:|^test .* \.\.\. (ok|FAILED)$|^failures:$|^    rust_additive_' /tmp/variants.log || true
            if [ "$tests_rc" -ne 0 ]; then
              echo
              echo "===== full variant failure log ====="
              cat /tmp/variants.log
            fi
          } > "$result"
          git add -- "$file" "$result"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git diff --cached --quiet; then
            git commit -m "test(port): format and record default-name variants"
            git push origin HEAD:agent/port-python-test-contracts-v3
          fi
          exit 0
