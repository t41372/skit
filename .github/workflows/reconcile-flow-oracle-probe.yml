name: Reconcile flow oracle probe

on:
  pull_request:
    paths:
      - .github/workflows/reconcile-flow-oracle-probe.yml
      - crates/skit-language/tests/port_test_reconcile_core.rs
      - crates/skit-application/tests/port_test_form_pipeline.rs

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run reconcile and flow oracles
        shell: bash
        run: |
          set +e
          cargo test --locked -p skit-language --test port_test_reconcile_core -- --nocapture
          echo "RECONCILE_CORE_RC=$?"
          cargo test --locked -p skit-application --test port_test_form_pipeline -- --nocapture
          echo "FORM_PIPELINE_RC=$?"
          exit 0
