name: Format port tests round 2

on:
  pull_request:
    paths:
      - .github/workflows/format-port-tests-round2.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/port-python-test-contracts-v3
          persist-credentials: true
      - name: Format only PR test files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            crates/skit-application/tests/port_test_form_pipeline.rs
            crates/skit-application/tests/port_test_tokens.rs
            crates/skit-domain/tests/port_test_param_model.rs
            crates/skit-domain/tests/port_test_path_type.rs
            crates/skit-form/tests/port_test_onboarding_cli.rs
            crates/skit-form/tests/port_test_onboarding_click_typer.rs
            crates/skit-form/tests/port_test_onboarding_fish.rs
            crates/skit-form/tests/port_test_onboarding_javascript.rs
            crates/skit-form/tests/port_test_onboarding_shell.rs
            crates/skit-form/tests/port_test_onboarding_shell_edges.rs
            crates/skit-form/tests/port_test_onboarding_signals.rs
            crates/skit-form/tests/port_test_prompt_form.rs
            crates/skit-form/tests/port_test_source_defaults.rs
            crates/skit-language/tests/port_test_default_injection.rs
            crates/skit-language/tests/port_test_javascript_dependencies.rs
            crates/skit-language/tests/port_test_managed_metadata.rs
            crates/skit-language/tests/port_test_managed_metadata_hand_edit.rs
            crates/skit-language/tests/port_test_path_reconcile.rs
            crates/skit-language/tests/port_test_prompt.rs
            crates/skit-language/tests/port_test_python_dependencies.rs
            crates/skit-language/tests/port_test_reconcile_core.rs
            crates/skit-language/tests/port_test_reconcile_defaults.rs
            crates/skit-language/tests/port_test_shebang_python_pin.rs
            crates/skit-language/tests/port_test_shell_read_delivery.rs
            crates/skit-runtime/tests/port_test_launcher.rs
            crates/skit-runtime/tests/port_test_launcher_fix.rs
            crates/skit-runtime/tests/port_test_prompt_launch.rs
            crates/skit-store/tests/port_test_argstate.rs
            crates/skit-store/tests/port_test_atomic_state.rs
            crates/skit-store/tests/port_test_config.rs
            crates/skit-store/tests/port_test_config_scalars.rs
            crates/skit-store/tests/port_test_default_delivery_bridge.rs
            crates/skit-store/tests/port_test_default_state_semantics.rs
            crates/skit-store/tests/port_test_glob_expansion.rs
            crates/skit-store/tests/port_test_prompt_runner_cas.rs
            crates/skit-store/tests/port_test_prompt_runner_config.rs
            crates/skit-store/tests/port_test_store_concurrency.rs
            crates/skit-store/tests/port_test_store_create.rs
            crates/skit-store/tests/port_test_store_fix.rs
            crates/skit-store/tests/port_test_store_metadata_shapes.rs
            crates/skit-store/tests/port_test_store_mutation.rs
            crates/skit-store/tests/port_test_store_orphan_truth.rs
            crates/skit-store/tests/port_test_store_registry_name_defense.rs
            crates/skit-store/tests/port_test_store_registry_repair.rs
            crates/skit-store/tests/registry_fast_read.rs
            crates/skit-store/tests/registry_resolve.rs
          )
          rustfmt --edition 2024 "${files[@]}"
          git add -- "${files[@]}"
          if git diff --cached --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "style(test): format port oracles"
          git push origin HEAD:agent/port-python-test-contracts-v3
