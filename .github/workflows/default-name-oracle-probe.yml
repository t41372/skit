name: Default name oracle probe

on:
  pull_request:
    paths:
      - .github/workflows/default-name-oracle-probe.yml
      - crates/skit-form/tests/port_test_default_name_resolution.rs
      - crates/skit-cli/tests/port_test_default_name_resolution_manifest.rs
      - crates/skit-cli/tests/port_test_source_default_semantics.rs
      - crates/skit-cli/tests/port_test_strength_gate.rs

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/port-python-test-contracts-v3
          persist-credentials: false
      - name: Run exact default-name oracles
        shell: bash
        run: |
          set +e
          rustfmt --edition 2024 --check \
            crates/skit-form/tests/port_test_default_name_resolution.rs \
            crates/skit-cli/tests/port_test_default_name_resolution_manifest.rs \
            crates/skit-cli/tests/port_test_source_default_semantics.rs
          echo "DEFAULT_NAME_RUSTFMT_RC=$?"
          cargo test --locked -p skit-cli-rs --test port_test_default_name_resolution_manifest -- --nocapture
          echo "DEFAULT_NAME_MANIFEST_RC=$?"
          cargo test --locked -p skit-cli-rs --test port_test_strength_gate -- --nocapture
          echo "STRENGTH_GATE_RC=$?"
          cargo test --locked -p skit-cli-rs --test port_test_source_default_semantics test_resync_current_default_and_rebind_and_untouched_input_share_one_pass -- --exact --nocapture
          echo "SOURCE_DEFAULT_REBIND_RC=$?"
          cargo test --locked -p skit-form --test port_test_default_name_resolution -- --nocapture --test-threads=1
          echo "DEFAULT_NAME_ORACLE_RC=$?"
          exit 0
