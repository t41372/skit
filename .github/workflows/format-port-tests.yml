name: Format port tests

on:
  push:
    branches: [agent/port-python-test-contracts-v3]
    paths: [.github/workflows/format-port-tests.yml]

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message == 'chore(port): format test-only oracle files'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/port-python-test-contracts-v3
          persist-credentials: true
      - name: Format only parity-port tests
        shell: bash
        run: |
          rustfmt --edition 2024 \
            crates/skit-runtime/tests/port_test_launcher.rs \
            crates/skit-runtime/tests/port_test_launcher_fix.rs \
            crates/skit-store/tests/port_test_argstate.rs \
            crates/skit-store/tests/port_test_atomic_state.rs \
            crates/skit-store/tests/port_test_store_concurrency.rs \
            crates/skit-store/tests/port_test_store_fix.rs \
            crates/skit-store/tests/port_test_store_registry_name_defense.rs \
            crates/skit-store/tests/port_test_store_registry_repair.rs \
            crates/skit-store/tests/registry_fast_read.rs \
            crates/skit-store/tests/registry_resolve.rs
          git diff --check
          if git diff --quiet -- \
            crates/skit-runtime/tests/port_test_launcher.rs \
            crates/skit-runtime/tests/port_test_launcher_fix.rs \
            crates/skit-store/tests/port_test_argstate.rs \
            crates/skit-store/tests/port_test_atomic_state.rs \
            crates/skit-store/tests/port_test_store_concurrency.rs \
            crates/skit-store/tests/port_test_store_fix.rs \
            crates/skit-store/tests/port_test_store_registry_name_defense.rs \
            crates/skit-store/tests/port_test_store_registry_repair.rs \
            crates/skit-store/tests/registry_fast_read.rs \
            crates/skit-store/tests/registry_resolve.rs; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            crates/skit-runtime/tests/port_test_launcher.rs \
            crates/skit-runtime/tests/port_test_launcher_fix.rs \
            crates/skit-store/tests/port_test_argstate.rs \
            crates/skit-store/tests/port_test_atomic_state.rs \
            crates/skit-store/tests/port_test_store_concurrency.rs \
            crates/skit-store/tests/port_test_store_fix.rs \
            crates/skit-store/tests/port_test_store_registry_name_defense.rs \
            crates/skit-store/tests/port_test_store_registry_repair.rs \
            crates/skit-store/tests/registry_fast_read.rs \
            crates/skit-store/tests/registry_resolve.rs
          git commit -m 'test(port): rustfmt oracle tests'
          git push origin HEAD:agent/port-python-test-contracts-v3
