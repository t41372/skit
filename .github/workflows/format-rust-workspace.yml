name: Format Rust workspace

on:
  pull_request:
    paths:
      - '.github/workflows/format-rust-workspace.yml'

permissions: {}

jobs:
  format:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Install Rust formatter
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
      - name: Format workspace
        run: cargo fmt --all
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git add 'crates/**/*.rs'
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(rust): apply Rust 1.97.1 formatting'
          git push origin "HEAD:${{ github.head_ref }}"
