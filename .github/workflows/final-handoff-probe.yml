name: Final handoff test integrity probe

on:
  push:
    branches:
      - agent/port-python-test-contracts-v3
    paths:
      - .github/workflows/final-handoff-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/port-python-test-contracts-v3
          persist-credentials: true
      - name: Fix additive provenance comment and verify test ledgers
        shell: bash
        run: |
          set +e
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/skit-cli/tests/port_test_params_edit_declared.rs')
          text = p.read_text()
          old = '''    // Rust has no caller-owned in-memory `edit_declared(list)` API. The executable behavioral
    // equivalent is that an edit addressed to `a` must not mutate the full persisted machine row
    // owned by sibling `b`. Forward-compatible metadata preservation is a separate storage
    // contract and is tested elsewhere; adding it here would manufacture a stronger, unrelated
    // failure and no longer represent this Python test.
'''
          new = '''    // Rust-additive CLI isolation coverage only. This is deliberately NOT an equivalent port of
    // Python `test_inputs_are_never_mutated`: Rust has no caller-owned public in-memory
    // `edit_declared(list)` seam. Sibling-row persistence is a different contract and must not
    // count toward the frozen Python parity ledger.
'''
          assert text.count(old) == 1, text.count(old)
          p.write_text(text.replace(old, new))
          PY

          files=(
            crates/skit-cli/tests/port_test_params_edit_declared.rs
            crates/skit-cli/tests/port_test_params_edit_manifest.rs
            crates/skit-cli/tests/port_test_manifest_integrity.rs
            crates/skit-cli/tests/port_test_reconcile_manifest.rs
            crates/skit-runtime/tests/port_test_launcher_workdir_regressions.rs
          )
          rustfmt --edition 2024 "${files[@]}" > /tmp/fh-format.log 2>&1
          format_rc=$?
          rustfmt --edition 2024 --check "${files[@]}" > /tmp/fh-rustfmt.log 2>&1
          rustfmt_rc=$?
          cargo test --locked -p skit-runtime --test port_test_launcher_workdir_regressions -- --nocapture --test-threads=1 > /tmp/fh-launcher.log 2>&1
          launcher_rc=$?
          cargo test --locked -p skit-cli-rs --test port_test_manifest_integrity -- --nocapture > /tmp/fh-integrity.log 2>&1
          integrity_rc=$?
          cargo test --locked -p skit-cli-rs --test port_test_declared_params_manifest -- --nocapture > /tmp/fh-declared.log 2>&1
          declared_rc=$?
          cargo test --locked -p skit-cli-rs --test port_test_params_edit_manifest -- --nocapture > /tmp/fh-edit.log 2>&1
          edit_rc=$?
          cargo test --locked -p skit-cli-rs --test port_test_reconcile_manifest -- --nocapture > /tmp/fh-reconcile.log 2>&1
          reconcile_rc=$?
          cargo test --locked -p skit-cli-rs --test port_test_strength_gate -- --nocapture > /tmp/fh-strength.log 2>&1
          strength_rc=$?

          result=crates/skit-cli/tests/final_handoff_probe_result.txt
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "FORMAT_RC=$format_rc"
            echo "RUSTFMT_RC=$rustfmt_rc"
            echo "LAUNCHER_RC=$launcher_rc"
            echo "MANIFEST_INTEGRITY_RC=$integrity_rc"
            echo "DECLARED_MANIFEST_RC=$declared_rc"
            echo "PARAMS_EDIT_MANIFEST_RC=$edit_rc"
            echo "RECONCILE_MANIFEST_RC=$reconcile_rc"
            echo "STRENGTH_GATE_RC=$strength_rc"
            for pair in \
              "format:$format_rc:/tmp/fh-format.log" \
              "rustfmt:$rustfmt_rc:/tmp/fh-rustfmt.log" \
              "launcher:$launcher_rc:/tmp/fh-launcher.log" \
              "manifest-integrity:$integrity_rc:/tmp/fh-integrity.log" \
              "declared:$declared_rc:/tmp/fh-declared.log" \
              "params-edit:$edit_rc:/tmp/fh-edit.log" \
              "reconcile:$reconcile_rc:/tmp/fh-reconcile.log" \
              "strength:$strength_rc:/tmp/fh-strength.log"
            do
              IFS=: read -r label rc log <<< "$pair"
              if [ "$rc" -ne 0 ]; then
                echo
                echo "===== $label failure log ====="
                cat "$log"
              fi
            done
          } > "$result"

          git add -- "${files[@]}" "$result"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git diff --cached --quiet; then
            git commit -m "test(port): finalize parity ledger integrity"
            git push origin HEAD:agent/port-python-test-contracts-v3
          fi
          exit 0
