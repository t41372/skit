name: Python deps oracle probe

on:
  pull_request:
    paths:
      - .github/workflows/python-deps-oracle-probe.yml
      - crates/skit-language/tests/port_test_python_dependencies.rs

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run python dependency oracle
        shell: bash
        run: |
          set +e
          cargo test --locked -p skit-language --test port_test_python_dependencies -- --nocapture
          rc=$?
          echo "PYTHON_DEPS_ORACLE_RC=$rc"
          exit 0
