name: Params edit ledger cleanup

on:
  push:
    branches:
      - agent/port-python-test-contracts-v3
    paths:
      - .github/workflows/params-edit-ledger-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/port-python-test-contracts-v3
          persist-credentials: true
      - name: Rename the Rust-additive sibling-row test
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("crates/skit-cli/tests/port_test_params_edit_declared.rs"); t=p.read_text(); old="fn test_inputs_are_never_mutated() {"; new="fn rust_additive_cli_edit_of_one_row_does_not_mutate_sibling_row() {"; assert t.count(old)==1, t.count(old); p.write_text(t.replace(old,new))'
          rustfmt --edition 2024 crates/skit-cli/tests/port_test_params_edit_declared.rs crates/skit-cli/tests/port_test_params_edit_manifest.rs
          git add -- crates/skit-cli/tests/port_test_params_edit_declared.rs crates/skit-cli/tests/port_test_params_edit_manifest.rs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git diff --cached --quiet; then
            git commit -m "test(port): stop impersonating params-edit helper contract"
            git push origin HEAD:agent/port-python-test-contracts-v3
          fi
