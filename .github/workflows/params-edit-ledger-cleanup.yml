name: Params edit ledger cleanup

# Temporary self-trigger; deleted after the test-only rename lands.
on:
  push:
    branches:
      - agent/port-python-test-contracts-v3
    paths:
      - .github/workflows/params-edit-ledger-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/port-python-test-contracts-v3
          persist-credentials: true
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/skit-cli/tests/port_test_params_edit_declared.rs')
          text = p.read_text()
          old_name = 'fn test_inputs_are_never_mutated() {'
          new_name = 'fn rust_additive_cli_edit_of_one_row_does_not_mutate_sibling_row() {'
          assert text.count(old_name) == 1, text.count(old_name)
          text = text.replace(old_name, new_name)
          old_comment = '''    // Rust has no caller-owned in-memory `edit_declared(list)` API. The executable behavioral
    // equivalent is that an edit addressed to `a` must not mutate the full persisted machine row
    // owned by sibling `b`. Forward-compatible metadata preservation is a separate storage
    // contract and is tested elsewhere; adding it here would manufacture a stronger, unrelated
    // failure and no longer represent this Python test.
'''
          new_comment = '''    // Rust-additive CLI isolation coverage. This is deliberately NOT presented as Python's
    // `test_inputs_are_never_mutated`: Rust has no caller-owned public in-memory
    // `edit_declared(list)` API, so sibling-row persistence is a different contract.
'''
          assert text.count(old_comment) == 1, text.count(old_comment)
          p.write_text(text.replace(old_comment, new_comment))
          PY
          rustfmt --edition 2024 crates/skit-cli/tests/port_test_params_edit_declared.rs crates/skit-cli/tests/port_test_params_edit_manifest.rs
          git add -- crates/skit-cli/tests/port_test_params_edit_declared.rs crates/skit-cli/tests/port_test_params_edit_manifest.rs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git diff --cached --quiet; then
            git commit -m "test(port): stop impersonating params-edit helper contract"
            git push origin HEAD:agent/port-python-test-contracts-v3
          fi
