name: Token oracle probe

on:
  pull_request:
    paths:
      - .github/workflows/token-oracle-probe.yml
      - crates/skit-application/tests/port_test_tokens.rs

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run token oracle
        shell: bash
        run: |
          set +e
          cargo test --locked -p skit-application --test port_test_tokens -- --nocapture
          rc=$?
          echo "TOKEN_ORACLE_RC=$rc"
          exit 0
