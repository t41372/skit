name: Format existing analyzer ports

on:
  pull_request:

permissions: {}

concurrency:
  group: format-existing-analyzer-ports-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/port-python-test-contracts'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Format the workspace
        run: cargo fmt --all
      - name: Commit only the two pre-existing analyzer format changes
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-allow-rustfmt-files.yml
          git add crates/skit-language/tests/port_test_analyzer.rs
          git add crates/skit-language/tests/port_test_analyzer_signals.rs
          git commit -m "style(test): format existing analyzer ports"
          git push origin "HEAD:refs/heads/${HEAD_BRANCH}"
