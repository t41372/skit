name: Allow rustfmt-only analyzer changes

on:
  push:
    branches:
      - agent/port-python-test-contracts

permissions: {}

concurrency:
  group: allow-rustfmt-analyzer
  cancel-in-progress: true

jobs:
  patch:
    if: github.ref == 'refs/heads/agent/port-python-test-contracts'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Extend the explicit format allowlist
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/agent-source-snapshot.yml')
          source = path.read_text()
          old = "crates/skit-language/tests/port_test_reconcile\\.rs|crates/skit-application/tests/port_test_tokens\\.rs"
          new = (
              "crates/skit-language/tests/port_test_reconcile\\.rs|"
              "crates/skit-language/tests/port_test_analyzer\\.rs|"
              "crates/skit-language/tests/port_test_analyzer_signals\\.rs|"
              "crates/skit-application/tests/port_test_tokens\\.rs"
          )
          if old not in source:
              raise RuntimeError('finalize allowlist changed unexpectedly')
          source = source.replace(old, new, 1)

          old = """            crates/skit-language/tests/port_test_reconcile.rs \\
            crates/skit-application/tests/port_test_tokens.rs \\
"""
          new = """            crates/skit-language/tests/port_test_reconcile.rs \\
            crates/skit-language/tests/port_test_analyzer.rs \\
            crates/skit-language/tests/port_test_analyzer_signals.rs \\
            crates/skit-application/tests/port_test_tokens.rs \\
"""
          if old not in source:
              raise RuntimeError('finalize git-add list changed unexpectedly')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Commit the workflow repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-allow-rustfmt-files.yml
          git add .github/workflows/agent-source-snapshot.yml
          git commit -m "ci(agent): allow verified rustfmt-only files"
          git push origin HEAD:refs/heads/agent/port-python-test-contracts
