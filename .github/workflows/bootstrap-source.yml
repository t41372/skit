name: Rewrite source snapshot

on:
  push:
    branches:
      - rewrite/rust-ratatui

permissions:
  contents: write

concurrency:
  group: rewrite-source-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    name: Package repository snapshot
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=skit-source.tar.gz HEAD
          sha256sum skit-source.tar.gz > skit-source.tar.gz.sha256
      - name: Upload source archive
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skit-source
          path: |
            skit-source.tar.gz
            skit-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Publish run identity
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          mkdir -p .rewrite-bootstrap
          cat > .rewrite-bootstrap/source.json <<EOF
          {
            "head_sha": "${GITHUB_SHA}",
            "run_id": ${GITHUB_RUN_ID},
            "artifact_id": ${ARTIFACT_ID}
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .rewrite-bootstrap/source.json
          git commit -m "chore(rewrite): record source snapshot artifact"
          git push
