name: Default review oracle probe

on:
  push:
    branches:
      - agent/port-python-test-contracts-v3
    paths:
      - .github/workflows/default-review-oracle-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/port-python-test-contracts-v3
          persist-credentials: true
      - name: Format and run exact default-review oracles
        shell: bash
        run: |
          set +e
          files=(
            crates/skit-store/tests/port_test_default_review_pipeline.rs
            crates/skit-language/tests/port_test_reconcile_defaults.rs
            crates/skit-store/tests/port_test_default_delivery_bridge.rs
            crates/skit-cli/tests/port_test_default_review_cli.rs
            crates/skit-cli/tests/port_test_default_review_manifest.rs
          )
          rustfmt --edition 2024 "${files[@]}" > /tmp/default-review-format.log 2>&1
          format_rc=$?
          rustfmt --edition 2024 --check "${files[@]}" > /tmp/default-review-rustfmt.log 2>&1
          rustfmt_rc=$?

          cargo test --locked -p skit-cli-rs --test port_test_default_review_manifest -- --nocapture \
            > /tmp/default-review-manifest.log 2>&1
          manifest_rc=$?
          cargo test --locked -p skit-cli-rs --test port_test_strength_gate -- --nocapture \
            > /tmp/default-review-strength.log 2>&1
          strength_rc=$?

          result=crates/skit-cli/tests/default_review_oracle_probe_result.txt
          : > "$result"
          echo "HEAD=$(git rev-parse HEAD)" >> "$result"
          echo "FORMAT_RC=$format_rc" >> "$result"
          echo "RUSTFMT_RC=$rustfmt_rc" >> "$result"
          echo "MANIFEST_RC=$manifest_rc" >> "$result"
          echo "STRENGTH_GATE_RC=$strength_rc" >> "$result"

          run_one() {
            crate="$1"; binary="$2"; name="$3"
            log="/tmp/${name}.log"
            cargo test --locked -p "$crate" --test "$binary" "$name" -- --exact --nocapture \
              > "$log" 2>&1
            rc=$?
            echo "$name=$rc" >> "$result"
            if [ "$rc" -ne 0 ]; then
              echo >> "$result"
              echo "===== $name failure tail =====" >> "$result"
              tail -n 100 "$log" >> "$result"
            fi
          }

          run_one skit-store port_test_default_review_pipeline test_secret_with_an_empty_source_literal_is_still_delivered
          run_one skit-store port_test_default_review_pipeline test_secret_field_never_delivers_empty
          run_one skit-store port_test_default_review_pipeline test_input_binding_with_a_default_is_delivered
          run_one skit-store port_test_default_review_pipeline test_main_guard_override_receives_the_unchanged_default
          run_one skit-language port_test_reconcile_defaults test_envdefault_default_that_no_longer_fits_the_type_is_not_published
          run_one skit-language port_test_reconcile_defaults test_int_shaped_literal_still_refreshes_a_str_envdefault
          run_one skit-cli-rs port_test_default_review_cli test_secret_source_literal_is_absent_from_reconcile_and_json
          run_one skit-cli-rs port_test_default_review_cli test_preset_from_last_saves_effective_values_after_an_all_defaults_run
          run_one skit-cli-rs port_test_default_review_cli test_preset_from_last_still_refuses_an_entry_that_never_ran
          run_one skit-cli-rs port_test_default_review_cli test_preset_from_last_pins_the_default_that_actually_ran
          run_one skit-cli-rs port_test_default_review_cli test_preset_from_legacy_run_without_snapshot_refuses_to_guess
          run_one skit-store port_test_default_review_pipeline test_last_used_filters_the_default_but_keeps_a_delivered_empty
          run_one skit-cli-rs port_test_default_review_cli test_run_save_preset_stores_a_default_equal_value_verbatim
          run_one skit-cli-rs port_test_default_review_cli test_resync_and_secret_in_one_edit_drops_the_refreshed_literal
          run_one skit-cli-rs port_test_default_review_cli test_final_no_secret_in_same_edit_keeps_the_public_default
          run_one skit-store port_test_default_delivery_bridge test_shell_colon_envdefaults_do_not_claim_to_deliver_empty
          run_one skit-store port_test_default_delivery_bridge test_shell_noncolon_envdefaults_genuinely_deliver_empty

          if [ "$format_rc" -ne 0 ]; then
            echo >> "$result"
            echo "===== format failure tail =====" >> "$result"
            tail -n 120 /tmp/default-review-format.log >> "$result"
          fi
          if [ "$rustfmt_rc" -ne 0 ]; then
            echo >> "$result"
            echo "===== rustfmt failure tail =====" >> "$result"
            tail -n 120 /tmp/default-review-rustfmt.log >> "$result"
          fi
          if [ "$manifest_rc" -ne 0 ]; then
            echo >> "$result"
            echo "===== manifest failure tail =====" >> "$result"
            tail -n 120 /tmp/default-review-manifest.log >> "$result"
          fi
          if [ "$strength_rc" -ne 0 ]; then
            echo >> "$result"
            echo "===== strength failure tail =====" >> "$result"
            tail -n 120 /tmp/default-review-strength.log >> "$result"
          fi

          git add -- "${files[@]}" "$result"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git diff --cached --quiet; then
            git commit -m "test(port): format and record default-review probe"
            git push origin HEAD:agent/port-python-test-contracts-v3
          fi
          exit 0
