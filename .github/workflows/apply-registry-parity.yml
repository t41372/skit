name: Apply registry parity patch

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/port-python-test-contracts-v3' && github.actor == 't41372'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/port-python-test-contracts-v3
      - name: Apply the pinned parity patch
        shell: bash
        run: |
          base64 --decode .github/registry-parity.patch.b64 | gzip --decompress > /tmp/registry-parity.patch
          test "$(sha256sum /tmp/registry-parity.patch | cut -d' ' -f1)" = ddb3a09b9c40b3e0db8727d1e7d94390829fd044dc73a6ae72e1e3d142127e96
          git apply --check /tmp/registry-parity.patch
          git apply /tmp/registry-parity.patch
          git diff --check
          git config user.name 'OpenAI parity agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/skit-store docs/design/python-test-port-ledger.md
          git commit -m 'fix(store): restore Python registry self-heal semantics'
          git push origin HEAD:agent/port-python-test-contracts-v3
