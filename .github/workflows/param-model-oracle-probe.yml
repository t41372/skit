name: Parameter model oracle probe

on:
  pull_request:
    paths:
      - .github/workflows/param-model-oracle-probe.yml
      - crates/skit-domain/tests/port_test_param_model.rs

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run parameter model oracle
        shell: bash
        run: |
          set +e
          cargo test --locked -p skit-domain --test port_test_param_model -- --nocapture
          rc=$?
          echo "PARAM_MODEL_ORACLE_RC=$rc"
          exit 0
