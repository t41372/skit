name: Prompt oracle probe

on:
  pull_request:
    paths:
      - .github/workflows/prompt-oracle-probe.yml
      - crates/skit-language/tests/port_test_prompt.rs

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run prompt oracle
        shell: bash
        run: |
          set +e
          cargo test --locked -p skit-language --test port_test_prompt -- --nocapture
          rc=$?
          echo "PROMPT_ORACLE_RC=$rc"
          exit 0
