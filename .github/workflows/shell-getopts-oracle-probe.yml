name: Shell getopts oracle probe

on:
  pull_request:
    paths:
      - .github/workflows/shell-getopts-oracle-probe.yml
      - crates/skit-cli/tests/port_test_shell_getopts.rs
      - crates/skit-cli/tests/port_test_shell_getopts_manifest.rs
      - crates/skit-cli/tests/port_test_strength_gate.rs

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run exact shell getopts oracles
        shell: bash
        run: |
          set +e
          rustfmt --edition 2024 --check \
            crates/skit-cli/tests/port_test_shell_getopts.rs \
            crates/skit-cli/tests/port_test_shell_getopts_manifest.rs
          echo "SHELL_GETOPTS_RUSTFMT_RC=$?"
          cargo test --locked -p skit-cli-rs --test port_test_shell_getopts_manifest -- --nocapture
          echo "SHELL_GETOPTS_MANIFEST_RC=$?"
          cargo test --locked -p skit-cli-rs --test port_test_strength_gate -- --nocapture
          echo "STRENGTH_GATE_RC=$?"
          cargo test --locked -p skit-cli-rs --test port_test_shell_getopts -- --nocapture --test-threads=1
          echo "SHELL_GETOPTS_ORACLE_RC=$?"
          exit 0
