name: JavaScript CLI reader oracle probe

on:
  push:
    branches:
      - agent/port-python-test-contracts-v3
    paths:
      - .github/workflows/js-cli-reader-oracle-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/port-python-test-contracts-v3
          persist-credentials: true
      - name: Run JavaScript CLI reader oracles
        shell: bash
        run: |
          set +e
          files=(
            crates/skit-form/tests/port_test_js_cli_reader_mut_exact.rs
            crates/skit-cli/tests/port_test_js_cli_reader_mut_manifest.rs
            crates/skit-store/tests/port_test_flows_mut_public.rs
          )
          rustfmt --edition 2024 "${files[@]}" > /tmp/js-reader-format.log 2>&1
          format_rc=$?
          rustfmt --edition 2024 --check "${files[@]}" > /tmp/js-reader-rustfmt.log 2>&1
          rustfmt_rc=$?
          cargo test --locked -p skit-form --test port_test_js_cli_reader_mut_exact -- --nocapture --test-threads=1 > /tmp/js-reader.log 2>&1
          reader_rc=$?
          cargo test --locked -p skit-cli-rs --test port_test_js_cli_reader_mut_manifest -- --nocapture > /tmp/js-reader-manifest.log 2>&1
          manifest_rc=$?
          cargo test --locked -p skit-store --test port_test_flows_mut_public -- --nocapture --test-threads=1 > /tmp/flows-additive.log 2>&1
          additive_rc=$?
          cargo test --locked -p skit-cli-rs --test port_test_strength_gate -- --nocapture > /tmp/js-reader-strength.log 2>&1
          strength_rc=$?

          result=crates/skit-cli/tests/js_cli_reader_oracle_probe_result.txt
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "FORMAT_RC=$format_rc"
            echo "RUSTFMT_RC=$rustfmt_rc"
            echo "JS_CLI_READER_RC=$reader_rc"
            echo "MANIFEST_RC=$manifest_rc"
            echo "FLOWS_ADDITIVE_RC=$additive_rc"
            echo "STRENGTH_GATE_RC=$strength_rc"
            for pair in \
              "format:$format_rc:/tmp/js-reader-format.log" \
              "rustfmt:$rustfmt_rc:/tmp/js-reader-rustfmt.log" \
              "reader:$reader_rc:/tmp/js-reader.log" \
              "manifest:$manifest_rc:/tmp/js-reader-manifest.log" \
              "flows-additive:$additive_rc:/tmp/flows-additive.log" \
              "strength:$strength_rc:/tmp/js-reader-strength.log"
            do
              IFS=: read -r label rc log <<< "$pair"
              if [ "$rc" -ne 0 ]; then
                echo
                echo "===== $label failure log ====="
                cat "$log"
              fi
            done
          } > "$result"
          git add -- "${files[@]}" "$result"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git diff --cached --quiet; then
            git commit -m "test(port): format and record JavaScript CLI reader probe"
            git push origin HEAD:agent/port-python-test-contracts-v3
          fi
          exit 0
