name: Parser mutation oracle probe

on:
  push:
    branches:
      - agent/port-python-test-contracts-v3
    paths:
      - .github/workflows/js-cli-reader-oracle-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/port-python-test-contracts-v3
          persist-credentials: true
      - name: Run complete parser mutation batch
        shell: bash
        run: |
          set +e
          files=(
            crates/skit-form/tests/port_test_js_cli_reader_mut_exact.rs
            crates/skit-cli/tests/port_test_js_cli_reader_mut_manifest.rs
            crates/skit-form/tests/port_test_argspec_mut_exact.rs
            crates/skit-cli/tests/port_test_argspec_mut_manifest.rs
            crates/skit-form/tests/port_test_shell_cli_reader_mut_exact.rs
            crates/skit-cli/tests/port_test_shell_cli_reader_mut_manifest.rs
            crates/skit-form/tests/port_test_fish_cli_reader_mut_exact.rs
            crates/skit-cli/tests/port_test_fish_cli_reader_mut_manifest.rs
            crates/skit-form/tests/port_test_js_analyzer_mut_exact.rs
            crates/skit-cli/tests/port_test_js_analyzer_mut_manifest.rs
            crates/skit-form/tests/port_test_shell_analyzer_mut_exact.rs
            crates/skit-cli/tests/port_test_shell_analyzer_mut_manifest.rs
            crates/skit-store/tests/port_test_flows_mut_public.rs
          )
          rustfmt --edition 2024 "${files[@]}" > /tmp/parser-format.log 2>&1
          format_rc=$?
          rustfmt --edition 2024 --check "${files[@]}" > /tmp/parser-rustfmt.log 2>&1
          rustfmt_rc=$?

          cargo test --locked -p skit-form --test port_test_js_cli_reader_mut_exact -- --nocapture --test-threads=1 > /tmp/js-reader.log 2>&1; js_rc=$?
          cargo test --locked -p skit-form --test port_test_argspec_mut_exact -- --nocapture --test-threads=1 > /tmp/argspec-mut.log 2>&1; argspec_rc=$?
          cargo test --locked -p skit-form --test port_test_shell_cli_reader_mut_exact -- --nocapture --test-threads=1 > /tmp/shell-reader.log 2>&1; shell_reader_rc=$?
          cargo test --locked -p skit-form --test port_test_fish_cli_reader_mut_exact -- --nocapture --test-threads=1 > /tmp/fish-reader.log 2>&1; fish_rc=$?
          cargo test --locked -p skit-form --test port_test_js_analyzer_mut_exact -- --nocapture --test-threads=1 > /tmp/js-analyzer.log 2>&1; js_analyzer_rc=$?
          cargo test --locked -p skit-form --test port_test_shell_analyzer_mut_exact -- --nocapture --test-threads=1 > /tmp/shell-analyzer.log 2>&1; shell_analyzer_rc=$?

          cargo test --locked -p skit-cli-rs --test port_test_js_cli_reader_mut_manifest -- --nocapture > /tmp/js-manifest.log 2>&1; js_manifest_rc=$?
          cargo test --locked -p skit-cli-rs --test port_test_argspec_mut_manifest -- --nocapture > /tmp/argspec-manifest.log 2>&1; argspec_manifest_rc=$?
          cargo test --locked -p skit-cli-rs --test port_test_shell_cli_reader_mut_manifest -- --nocapture > /tmp/shell-reader-manifest.log 2>&1; shell_reader_manifest_rc=$?
          cargo test --locked -p skit-cli-rs --test port_test_fish_cli_reader_mut_manifest -- --nocapture > /tmp/fish-manifest.log 2>&1; fish_manifest_rc=$?
          cargo test --locked -p skit-cli-rs --test port_test_js_analyzer_mut_manifest -- --nocapture > /tmp/js-analyzer-manifest.log 2>&1; js_analyzer_manifest_rc=$?
          cargo test --locked -p skit-cli-rs --test port_test_shell_analyzer_mut_manifest -- --nocapture > /tmp/shell-analyzer-manifest.log 2>&1; shell_analyzer_manifest_rc=$?
          cargo test --locked -p skit-store --test port_test_flows_mut_public -- --nocapture --test-threads=1 > /tmp/flows-additive.log 2>&1; additive_rc=$?
          cargo test --locked -p skit-cli-rs --test port_test_strength_gate -- --nocapture > /tmp/strength.log 2>&1; strength_rc=$?

          result=crates/skit-cli/tests/js_cli_reader_oracle_probe_result.txt
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "FORMAT_RC=$format_rc"
            echo "RUSTFMT_RC=$rustfmt_rc"
            echo "JS_CLI_READER_RC=$js_rc"
            echo "ARGSPEC_MUT_RC=$argspec_rc"
            echo "SHELL_CLI_READER_RC=$shell_reader_rc"
            echo "FISH_CLI_READER_RC=$fish_rc"
            echo "JS_ANALYZER_RC=$js_analyzer_rc"
            echo "SHELL_ANALYZER_RC=$shell_analyzer_rc"
            echo "JS_MANIFEST_RC=$js_manifest_rc"
            echo "ARGSPEC_MANIFEST_RC=$argspec_manifest_rc"
            echo "SHELL_READER_MANIFEST_RC=$shell_reader_manifest_rc"
            echo "FISH_MANIFEST_RC=$fish_manifest_rc"
            echo "JS_ANALYZER_MANIFEST_RC=$js_analyzer_manifest_rc"
            echo "SHELL_ANALYZER_MANIFEST_RC=$shell_analyzer_manifest_rc"
            echo "FLOWS_ADDITIVE_RC=$additive_rc"
            echo "STRENGTH_GATE_RC=$strength_rc"
            for pair in \
              "format:$format_rc:/tmp/parser-format.log" \
              "rustfmt:$rustfmt_rc:/tmp/parser-rustfmt.log" \
              "js-reader:$js_rc:/tmp/js-reader.log" \
              "argspec:$argspec_rc:/tmp/argspec-mut.log" \
              "shell-reader:$shell_reader_rc:/tmp/shell-reader.log" \
              "fish:$fish_rc:/tmp/fish-reader.log" \
              "js-analyzer:$js_analyzer_rc:/tmp/js-analyzer.log" \
              "shell-analyzer:$shell_analyzer_rc:/tmp/shell-analyzer.log" \
              "js-manifest:$js_manifest_rc:/tmp/js-manifest.log" \
              "argspec-manifest:$argspec_manifest_rc:/tmp/argspec-manifest.log" \
              "shell-reader-manifest:$shell_reader_manifest_rc:/tmp/shell-reader-manifest.log" \
              "fish-manifest:$fish_manifest_rc:/tmp/fish-manifest.log" \
              "js-analyzer-manifest:$js_analyzer_manifest_rc:/tmp/js-analyzer-manifest.log" \
              "shell-analyzer-manifest:$shell_analyzer_manifest_rc:/tmp/shell-analyzer-manifest.log" \
              "flows-additive:$additive_rc:/tmp/flows-additive.log" \
              "strength:$strength_rc:/tmp/strength.log"
            do
              IFS=: read -r label rc log <<< "$pair"
              if [ "$rc" -ne 0 ]; then
                echo
                echo "===== $label failure log ====="
                cat "$log"
              fi
            done
          } > "$result"
          git add -- "${files[@]}" "$result"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git diff --cached --quiet; then
            git commit -m "test(port): format and record parser mutation probe"
            git push origin HEAD:agent/port-python-test-contracts-v3
          fi
          exit 0
