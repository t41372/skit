name: Refresh active locks

on:
  pull_request:
    paths:
      - '.github/workflows/refresh-active-locks.yml'

permissions: {}

jobs:
  refresh:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Install current stable Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - name: Setup current Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.5.0'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Use current npm
        run: npm install --global npm@12.0.2
      - name: Refresh Cargo lock
        run: cargo update
      - name: Refresh docs lock
        working-directory: docs
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated locks
        shell: bash
        run: |
          set -euo pipefail
          git add Cargo.lock docs/package-lock.json
          if git diff --cached --quiet; then
            echo 'Active lockfiles already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: refresh active dependency locks'
          git push origin "HEAD:${{ github.head_ref }}"
