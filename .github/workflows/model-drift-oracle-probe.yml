name: Model and drift oracle probe

on:
  push:
    branches:
      - agent/port-python-test-contracts-v3
    paths:
      - .github/workflows/model-drift-oracle-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/port-python-test-contracts-v3
          persist-credentials: true
      - name: Run model and drift oracles
        shell: bash
        run: |
          set +e
          files=(
            crates/skit-domain/tests/port_test_param_model.rs
            crates/skit-language/tests/port_test_param_model_candidate.rs
            crates/skit-cli/tests/port_test_param_model_manifest.rs
            crates/skit-language/tests/port_test_shell_injection_drift.rs
            crates/skit-cli/tests/port_test_javascript_injection_mut_manifest.rs
            crates/skit-cli/tests/port_test_strength_gate.rs
          )
          rustfmt --edition 2024 "${files[@]}" > /tmp/model-format.log 2>&1
          format_rc=$?
          rustfmt --edition 2024 --check "${files[@]}" > /tmp/model-rustfmt.log 2>&1
          rustfmt_rc=$?
          cargo test --locked -p skit-cli-rs --test port_test_strength_gate -- --nocapture > /tmp/model-strength.log 2>&1
          strength_rc=$?
          cargo test --locked -p skit-cli-rs --test port_test_param_model_manifest -- --nocapture > /tmp/model-manifest.log 2>&1
          manifest_rc=$?
          cargo test --locked -p skit-domain --test port_test_param_model -- --nocapture --test-threads=1 > /tmp/model-domain.log 2>&1
          domain_rc=$?
          cargo test --locked -p skit-language --test port_test_param_model_candidate -- --nocapture --test-threads=1 > /tmp/model-candidate.log 2>&1
          candidate_rc=$?
          cargo test --locked -p skit-language --test port_test_shell_injection_drift -- --nocapture --test-threads=1 > /tmp/model-shell-drift.log 2>&1
          shell_drift_rc=$?
          cargo test --locked -p skit-cli-rs --test port_test_javascript_injection_mut_manifest -- --nocapture > /tmp/model-js-manifest.log 2>&1
          js_manifest_rc=$?

          result=crates/skit-cli/tests/model_drift_oracle_probe_result.txt
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "FORMAT_RC=$format_rc"
            echo "RUSTFMT_RC=$rustfmt_rc"
            echo "STRENGTH_GATE_RC=$strength_rc"
            echo "PARAM_MODEL_MANIFEST_RC=$manifest_rc"
            echo "PARAM_MODEL_DOMAIN_RC=$domain_rc"
            echo "PARAM_MODEL_CANDIDATE_RC=$candidate_rc"
            echo "SHELL_DRIFT_RC=$shell_drift_rc"
            echo "JS_INJECTION_MANIFEST_RC=$js_manifest_rc"
            for pair in \
              "format:$format_rc:/tmp/model-format.log" \
              "rustfmt:$rustfmt_rc:/tmp/model-rustfmt.log" \
              "strength:$strength_rc:/tmp/model-strength.log" \
              "manifest:$manifest_rc:/tmp/model-manifest.log" \
              "domain:$domain_rc:/tmp/model-domain.log" \
              "candidate:$candidate_rc:/tmp/model-candidate.log" \
              "shell-drift:$shell_drift_rc:/tmp/model-shell-drift.log" \
              "js-manifest:$js_manifest_rc:/tmp/model-js-manifest.log"
            do
              IFS=: read -r label rc log <<< "$pair"
              if [ "$rc" -ne 0 ]; then
                echo
                echo "===== $label failure log ====="
                cat "$log"
              fi
            done
          } > "$result"
          git add -- "${files[@]}" "$result"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git diff --cached --quiet; then
            git commit -m "test(port): format and record model drift probe"
            git push origin HEAD:agent/port-python-test-contracts-v3
          fi
          exit 0
