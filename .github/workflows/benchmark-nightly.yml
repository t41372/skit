name: benchmark (nightly)

on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: benchmark-nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  BENCH_CI_RUNNER: ubuntu-24.04
  PYTHONUTF8: "1"

jobs:
  bench-full:
    name: Full profile
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python and uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          python-version: "3.13"
          activate-environment: true
          enable-cache: true
      - name: Verify benchmark Python 3.13
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 13), sys.version'
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install strace
        run: sudo apt-get update -q && sudo apt-get install -y -q strace
      - name: Install hyperfine
        uses: ./.github/actions/install-hyperfine
      - name: Build the measured binary and harness
        run: cargo build --locked --release -p skit-cli-rs -p skit-benchmarks
      - name: Run Criterion subjects
        run: cargo bench --locked -p skit-benchmarks
      - name: Run the full profile
        run: bash benchmarks/run.sh full .bench target/release/skit
      - name: Check budgets
        run: bash benchmarks/check.sh .bench/results.json benchmarks/budgets.toml --require-enforced
      - name: Publish the result table
        if: ${{ !cancelled() }}
        run: cat .bench/results.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results-full
          include-hidden-files: true
          path: |
            .bench/
            target/criterion/
          retention-days: 90
