name: benchmark (nightly)

on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: benchmark-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench-full:
    name: Full profile
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install hyperfine
        uses: ./.github/actions/install-hyperfine
      - name: Build the release binary
        run: cargo build --locked --release -p skit-cli-rs
      - name: Run Criterion subjects
        run: cargo bench --locked -p skit-benchmarks
      - name: Run the full macro profile
        run: bash benchmarks/run.sh full .bench target/release/skit
      - name: Check budgets
        run: bash benchmarks/check.sh .bench/results.json benchmarks/budgets.toml --require-enforced
      - name: Publish the result table
        if: ${{ !cancelled() }}
        run: cat .bench/results.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results-full
          include-hidden-files: true
          path: |
            .bench/
            target/criterion/
          retention-days: 90
