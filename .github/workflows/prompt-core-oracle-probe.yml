name: Prompt core oracle probe

on:
  push:
    branches:
      - agent/port-python-test-contracts-v3
    paths:
      - .github/workflows/prompt-core-oracle-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/port-python-test-contracts-v3
          persist-credentials: true
      - name: Run prompt core oracles
        shell: bash
        run: |
          set +e
          file=crates/skit-language/tests/port_test_prompt.rs
          rustfmt --edition 2024 "$file"
          format_rc=$?
          rustfmt --edition 2024 --check "$file"
          rustfmt_rc=$?
          cargo test --locked -p skit-language --test port_test_prompt -- --nocapture --test-threads=1 > /tmp/prompt.log 2>&1
          prompt_rc=$?
          result=crates/skit-cli/tests/prompt_core_oracle_probe_result.txt
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "FORMAT_RC=$format_rc"
            echo "RUSTFMT_RC=$rustfmt_rc"
            echo "PROMPT_CORE_RC=$prompt_rc"
            grep -E '^test result:|^test .* \.\.\. (ok|FAILED)$|^failures:$|^    test_' /tmp/prompt.log || true
            if [ "$prompt_rc" -ne 0 ]; then
              echo
              echo "===== full prompt failure log ====="
              cat /tmp/prompt.log
            fi
          } > "$result"
          git add -- "$file" "$result"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git diff --cached --quiet; then
            git commit -m "test(port): format and record prompt core probe"
            git push origin HEAD:agent/port-python-test-contracts-v3
          fi
          exit 0
