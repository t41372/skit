name: Prompt core oracle probe

# Retry self-trigger after model/drift cleanup; deleted after diagnostics are read.
on:
  push:
    branches:
      - agent/port-python-test-contracts-v3
    paths:
      - .github/workflows/prompt-core-oracle-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/port-python-test-contracts-v3
          persist-credentials: true
      - name: Run prompt core and exact guards
        shell: bash
        run: |
          set +e
          files=(
            crates/skit-language/tests/port_test_prompt.rs
            crates/skit-cli/tests/port_test_prompt_language_manifest.rs
            crates/skit-cli/tests/port_test_strength_gate.rs
            crates/skit-domain/tests/port_test_slugify.rs
            crates/skit-cli/tests/port_test_launcher_fix_manifest.rs
          )
          rustfmt --edition 2024 "${files[@]}" > /tmp/prompt-format.log 2>&1
          format_rc=$?
          rustfmt --edition 2024 --check "${files[@]}" > /tmp/prompt-rustfmt.log 2>&1
          rustfmt_rc=$?
          cargo test --locked -p skit-language --test port_test_prompt -- --nocapture --test-threads=1 > /tmp/prompt.log 2>&1
          prompt_rc=$?
          cargo test --locked -p skit-cli-rs --test port_test_prompt_language_manifest -- --nocapture > /tmp/prompt-manifest.log 2>&1
          prompt_manifest_rc=$?
          cargo test --locked -p skit-cli-rs --test port_test_strength_gate -- --nocapture > /tmp/strength.log 2>&1
          strength_rc=$?
          cargo test --locked -p skit-domain --test port_test_slugify -- --nocapture --test-threads=1 > /tmp/slug.log 2>&1
          slug_rc=$?
          cargo test --locked -p skit-cli-rs --test port_test_launcher_fix_manifest -- --nocapture > /tmp/launcher-manifest.log 2>&1
          launcher_manifest_rc=$?
          cargo test --locked -p skit-runtime --test port_test_launcher_fix -- --nocapture --test-threads=1 > /tmp/launcher.log 2>&1
          launcher_rc=$?

          result=crates/skit-cli/tests/prompt_core_oracle_probe_result.txt
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "FORMAT_RC=$format_rc"
            echo "RUSTFMT_RC=$rustfmt_rc"
            echo "PROMPT_CORE_RC=$prompt_rc"
            echo "PROMPT_MANIFEST_RC=$prompt_manifest_rc"
            echo "STRENGTH_GATE_RC=$strength_rc"
            echo "SLUGIFY_RC=$slug_rc"
            echo "LAUNCHER_FIX_MANIFEST_RC=$launcher_manifest_rc"
            echo "LAUNCHER_FIX_RC=$launcher_rc"
            for pair in \
              "format:$format_rc:/tmp/prompt-format.log" \
              "rustfmt:$rustfmt_rc:/tmp/prompt-rustfmt.log" \
              "prompt:$prompt_rc:/tmp/prompt.log" \
              "prompt-manifest:$prompt_manifest_rc:/tmp/prompt-manifest.log" \
              "strength:$strength_rc:/tmp/strength.log" \
              "slug:$slug_rc:/tmp/slug.log" \
              "launcher-manifest:$launcher_manifest_rc:/tmp/launcher-manifest.log" \
              "launcher:$launcher_rc:/tmp/launcher.log"
            do
              IFS=: read -r label rc log <<< "$pair"
              if [ "$rc" -ne 0 ]; then
                echo
                echo "===== $label failure log ====="
                cat "$log"
              fi
            done
          } > "$result"
          git add -- "${files[@]}" "$result"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git diff --cached --quiet; then
            git commit -m "test(port): format and record prompt core probe"
            git push origin HEAD:agent/port-python-test-contracts-v3
          fi
          exit 0
