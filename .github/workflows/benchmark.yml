name: benchmark

on:
  push:
    branches: [main]
    paths: ["crates/**", "benchmarks/**", "Cargo.toml", "Cargo.lock", ".github/workflows/benchmark*.yml"]
  pull_request:
    paths: ["crates/**", "benchmarks/**", "Cargo.toml", "Cargo.lock", ".github/workflows/benchmark*.yml"]

permissions: {}

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench-pr:
    name: PR profile (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install hyperfine
        uses: ./.github/actions/install-hyperfine
      - name: Build the release binary
        run: cargo build --locked --release -p skit-cli-rs
      - name: Run Criterion subjects
        run: cargo bench --locked -p skit-benchmarks
      - name: Run macro measurements
        run: bash benchmarks/run.sh pr .bench target/release/skit
      - name: Check budgets
        run: bash benchmarks/check.sh .bench/results.json benchmarks/budgets.toml --require-enforced
      - name: Publish the result table
        if: ${{ !cancelled() }}
        run: cat .bench/results.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results-pr
          include-hidden-files: true
          path: |
            .bench/results.json
            .bench/results.md
            .bench/hyperfine.json
            target/criterion/
          retention-days: 30
