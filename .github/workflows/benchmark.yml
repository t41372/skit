name: benchmark

# The performance evaluation pipeline's PR-path job (docs/design/benchmarks.md): runs
# the pr profile, gates the enforced budget tier, and publishes the results table +
# artifacts. ADVISORY BY POLICY: this job must never be configured as a required
# status check while path-filtered — GitHub leaves path-skipped required checks
# "Pending" forever, which would block every docs-only PR. A red job here is visible
# shame, not a merge lock.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'benchmarks/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/benchmark*.yml'
      - '.github/actions/**'
  pull_request:
    paths:
      - 'src/**'
      - 'benchmarks/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/benchmark*.yml'
      - '.github/actions/**'

permissions: {}

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  BENCH_CI_RUNNER: ubuntu-24.04

jobs:
  bench-pr:
    name: pr profile (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14.6"
          enable-cache: true
          prune-cache: true
      - name: Sync dependencies
        run: uv sync --dev
      - name: Install hyperfine (pinned)
        uses: ./.github/actions/install-hyperfine
      - name: Run pr profile
        run: uv run python -m benchmarks run --profile pr --out .bench
      - name: Check budgets (enforced tier gates this job)
        run: uv run python -m benchmarks check .bench/results.json --require-enforced
      - name: Publish step summary
        if: ${{ !cancelled() }}
        run: cat .bench/results.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results-pr
          include-hidden-files: true
          path: |
            .bench/results.json
            .bench/results.md
            .bench/run.json
            .bench/suites/
            .bench/artifacts/
          retention-days: 30
