name: benchmark

on:
  push:
    branches: [main]
    paths: ["crates/**", "benchmarks/**", "Cargo.toml", "Cargo.lock", ".github/workflows/benchmark*.yml", ".github/actions/**"]
  pull_request:
    paths: ["crates/**", "benchmarks/**", "Cargo.toml", "Cargo.lock", ".github/workflows/benchmark*.yml", ".github/actions/**"]

permissions: {}

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BENCH_CI_RUNNER: ubuntu-24.04
  PYTHONUTF8: "1"

jobs:
  bench-pr:
    name: PR profile (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python and uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.13"
          activate-environment: true
          # This job installs no package with uv, so uv never makes its cache directory. The
          # setup-uv post step then fails on the absent path. Keep the cache off.
          enable-cache: false
      - name: Verify benchmark Python 3.13
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 13), sys.version'
      - name: Install hyperfine
        uses: $/.github/actions/install-hyperfine
      - name: Build the measured binary and harness
        run: cargo build --locked --release -p skit-cli-rs -p skit-benchmarks
      - name: Run Criterion subjects
        run: cargo bench --locked -p skit-benchmarks
      - name: Run the PR profile
        run: bash benchmarks/run.sh pr .bench target/release/skit
      - name: Check budgets
        run: bash benchmarks/check.sh .bench/results.json benchmarks/budgets.toml --require-enforced
      - name: Publish the result table
        if: ${{ !cancelled() }}
        run: cat .bench/results.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results-pr
          include-hidden-files: true
          path: |
            .bench/
            target/criterion/
          retention-days: 30
