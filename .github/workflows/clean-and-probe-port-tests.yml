name: Clean and probe port tests

on:
  push:
    branches: [agent/port-python-test-contracts-v3]
    paths: [.github/workflows/clean-and-probe-port-tests.yml]

permissions:
  contents: write

jobs:
  clean-probe:
    if: github.event.head_commit.message == 'chore(port): clean and probe test-only files'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/port-python-test-contracts-v3
          persist-credentials: true
      - name: Clean test-only files and probe CAS
        shell: bash
        run: |
          sed -i '/^[[:space:]]*collections::BTreeMap,$/d' crates/skit-store/tests/port_test_prompt_runner_config.rs
          rustfmt --edition 2024 \
            crates/skit-store/tests/port_test_prompt_runner_config.rs \
            crates/skit-store/tests/port_test_prompt_runner_cas.rs \
            crates/skit-store/tests/port_test_store_create.rs

          set +e
          for target in port_test_prompt_runner_cas port_test_store_create port_test_prompt_runner_config; do
            echo "::group::$target"
            cargo test --locked -p skit-store --test "$target" -- --nocapture
            echo "PORT_TARGET_RC $target $?"
            echo "::endgroup::"
          done
          set -e

          git diff --check
          if ! git diff --quiet -- \
            crates/skit-store/tests/port_test_prompt_runner_config.rs \
            crates/skit-store/tests/port_test_prompt_runner_cas.rs \
            crates/skit-store/tests/port_test_store_create.rs; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -- \
              crates/skit-store/tests/port_test_prompt_runner_config.rs \
              crates/skit-store/tests/port_test_prompt_runner_cas.rs \
              crates/skit-store/tests/port_test_store_create.rs
            git commit -m 'test(port): clean prompt and create oracles'
            git push origin HEAD:agent/port-python-test-contracts-v3
          fi
