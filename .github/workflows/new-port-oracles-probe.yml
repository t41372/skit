name: New port oracles probe

on:
  pull_request:
    paths:
      - .github/workflows/new-port-oracles-probe.yml
      - crates/skit-store/tests/port_test_store_create.rs
      - crates/skit-store/tests/port_test_prompt_runner_config.rs

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run new oracles
        shell: bash
        run: |
          set +e
          failures=0
          for target in port_test_store_create port_test_prompt_runner_config; do
            echo "::group::$target"
            cargo test --locked -p skit-store --test "$target" -- --nocapture
            rc=$?
            echo "PORT_TARGET_RC $target $rc"
            [ "$rc" -eq 0 ] || failures=$((failures + 1))
            echo "::endgroup::"
          done
          echo "PORT_TARGET_FAILURE_GROUPS=$failures"
          exit 0
