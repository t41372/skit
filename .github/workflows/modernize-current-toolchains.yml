name: Modernize current toolchains

on:
  pull_request:
    paths:
      - '.github/workflows/modernize-current-toolchains.yml'
  workflow_dispatch:

permissions: {}

jobs:
  modernize:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - name: Install current uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.3'
          python-version: '3.14.6'
          enable-cache: false
      - name: Install current Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
      - name: Setup current Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.5.0'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install current npm
        run: npm install --global npm@12.0.2
      - name: Ratchet direct Python versions and uv build backend
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('pyproject.toml')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'typer>=0.27.0,<1': 'typer>=0.27.1,<1',
              'platformdirs>=4.11.0,<5': 'platformdirs>=4.11.1,<5',
              'packaging>=26.2,<27': 'packaging>=26.3,<27',
              'ty>=0.0.62,<0.1': 'ty>=0.0.69,<0.1',
              'mutmut>=3.6.0,<4': 'mutmut>=3.7.0,<4',
              'zizmor>=1.27.0,<2': 'zizmor>=1.29.0,<2',
              'uv_build>=0.11.31,<0.12': 'uv_build>=0.12.1,<0.13',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected version declaration: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Pin uv version in permanent workflows
        run: |
          python - <<'PY'
          from pathlib import Path

          for path in Path('.github/workflows').glob('*.yml'):
              if path.name == 'modernize-current-toolchains.yml':
                  continue
              lines = path.read_text(encoding='utf-8').splitlines()
              out: list[str] = []
              index = 0
              changed = False
              while index < len(lines):
                  line = lines[index]
                  out.append(line)
                  if 'uses: astral-sh/setup-uv@' in line:
                      index += 1
                      if index >= len(lines) or lines[index].strip() != 'with:':
                          raise SystemExit(f'{path}: setup-uv without with block')
                      out.append(lines[index])
                      next_line = lines[index + 1] if index + 1 < len(lines) else ''
                      if next_line.strip().startswith('version:'):
                          pass
                      else:
                          indent = lines[index][: len(lines[index]) - len(lines[index].lstrip())] + '  '
                          out.append(f'{indent}version: "0.12.3"')
                          changed = True
                  index += 1
              if changed:
                  path.write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY
      - name: Refresh Python lock and environment
        run: |
          uv lock --upgrade
          uv sync --dev
      - name: Apply current Python formatting
        run: uv run ruff format
      - name: Apply current Rust formatting
        run: cargo fmt --all
      - name: Refresh docs lock with npm 12
        working-directory: docs
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated modernizations
        shell: bash
        run: |
          set -euo pipefail
          git add pyproject.toml uv.lock docs/package-lock.json .github/workflows '*.toml' \
            benchmarks src crates
          if git diff --cached --quiet; then
            echo 'Everything already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: adopt current formatter and toolchain output'
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
