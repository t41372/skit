name: Config mutation oracle probe

on:
  push:
    branches:
      - agent/port-python-test-contracts-v3
    paths:
      - .github/workflows/config-mut-oracle-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/port-python-test-contracts-v3
          persist-credentials: true
      - name: Run config mutation oracles
        shell: bash
        run: |
          set +e
          files=(
            crates/skit-store/tests/port_test_config_mut_exact.rs
            crates/skit-cli/tests/port_test_config_mut_manifest.rs
          )
          rustfmt --edition 2024 "${files[@]}" > /tmp/config-mut-format.log 2>&1
          format_rc=$?
          rustfmt --edition 2024 --check "${files[@]}" > /tmp/config-mut-rustfmt.log 2>&1
          rustfmt_rc=$?
          cargo test --locked -p skit-store --test port_test_config_mut_exact -- --nocapture --test-threads=1 > /tmp/config-mut.log 2>&1
          config_rc=$?
          cargo test --locked -p skit-cli-rs --test port_test_config_mut_manifest -- --nocapture > /tmp/config-mut-manifest.log 2>&1
          manifest_rc=$?
          cargo test --locked -p skit-cli-rs --test port_test_strength_gate -- --nocapture > /tmp/config-mut-strength.log 2>&1
          strength_rc=$?

          result=crates/skit-cli/tests/config_mut_oracle_probe_result.txt
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "FORMAT_RC=$format_rc"
            echo "RUSTFMT_RC=$rustfmt_rc"
            echo "CONFIG_MUT_RC=$config_rc"
            echo "MANIFEST_RC=$manifest_rc"
            echo "STRENGTH_GATE_RC=$strength_rc"
            for pair in \
              "format:$format_rc:/tmp/config-mut-format.log" \
              "rustfmt:$rustfmt_rc:/tmp/config-mut-rustfmt.log" \
              "config:$config_rc:/tmp/config-mut.log" \
              "manifest:$manifest_rc:/tmp/config-mut-manifest.log" \
              "strength:$strength_rc:/tmp/config-mut-strength.log"
            do
              IFS=: read -r label rc log <<< "$pair"
              if [ "$rc" -ne 0 ]; then
                echo
                echo "===== $label failure log ====="
                cat "$log"
              fi
            done
          } > "$result"
          git add -- "${files[@]}" "$result"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git diff --cached --quiet; then
            git commit -m "test(port): format and record config mutation probe"
            git push origin HEAD:agent/port-python-test-contracts-v3
          fi
          exit 0
