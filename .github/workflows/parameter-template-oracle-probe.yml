name: Parameter template oracle probe

on:
  pull_request:
    paths:
      - .github/workflows/parameter-template-oracle-probe.yml
      - crates/skit-application/tests/port_test_parameter_edit.rs
      - crates/skit-runtime/tests/port_test_command_template_quoting.rs

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run parameter and template oracles
        shell: bash
        run: |
          set +e
          cargo test --locked -p skit-application --test port_test_parameter_edit -- --nocapture
          echo "PARAMETER_EDIT_RC=$?"
          cargo test --locked -p skit-runtime --test port_test_command_template_quoting -- --nocapture
          echo "COMMAND_TEMPLATE_QUOTING_RC=$?"
          exit 0
