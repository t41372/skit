name: Fixup run-set tests

on:
  pull_request:
    paths:
      - .github/workflows/fixup-run-set-tests.yml

permissions:
  contents: write

jobs:
  fixup:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/port-python-test-contracts-v3
          persist-credentials: true
      - name: Fix translation bug, strengthen secret fixture, and format tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/skit-cli/tests/port_test_run_set.rs')
          s = p.read_text()
          s = s.replace(
              'use skit_domain::parameters::{ParamDecl, ParameterBinding, ParameterType};',
              'use skit_domain::parameters::{\n    ParamDecl, ParameterBinding, ParameterDelivery, ParameterType,\n};',
          )
          s = s.replace(
              '    city.binding = ParameterBinding::Const;\n    city.parameter_type = ParameterType::Str;\n',
              '    city.binding = ParameterBinding::Const;\n    city.delivery = ParameterDelivery::Inject;\n    city.parameter_type = ParameterType::Str;\n',
              1,
          )
          s = s.replace(
              '    times.binding = ParameterBinding::Const;\n    times.parameter_type = ParameterType::Int;\n',
              '    times.binding = ParameterBinding::Const;\n    times.delivery = ParameterDelivery::Inject;\n    times.parameter_type = ParameterType::Int;\n',
              1,
          )
          old = '''    let dry = sandbox.output(&[\n        "run",\n        "api",\n        "--set",\n        "KEY=s3cret-value",\n        "--dry-run",\n        "--no-input",\n    ]);\n    assert_success(&["run", "api", "--dry-run"], &dry);\n    assert!(!combined(&dry).contains("s3cret-value"), "{}", combined(&dry));\n    assert!(combined(&dry).contains("•••"), "{}", combined(&dry));\n\n    let uv = sandbox.compile_fake_uv();\n    let capture = sandbox.home.path().join("secret-captured.py");\n    let run = sandbox\n        .command()\n        .env("PATH", uv.parent().unwrap())\n        .env("SKIT_CAPTURE_SCRIPT", &capture)\n        .args(["run", "api", "--set", "KEY=s3cret-value", "--no-input"])\n        .output()\n        .unwrap();\n    assert_success(&["run", "api"], &run);\n    assert!(fs::read_to_string(capture).unwrap().contains("s3cret-value"));\n    let state = sandbox.state_text("api");\n    assert!(!state.contains("s3cret-value"), "secret leaked to state:\\n{state}");\n    assert_eq!(sandbox.value("api", "KEY"), None);\n'''
          new = '''    let show = sandbox.ok(&["show", "api", "--json"]);\n    let document: serde_json::Value = serde_json::from_slice(&show.stdout).unwrap();\n    let field = document["fields"]\n        .as_array()\n        .unwrap()\n        .iter()\n        .find(|field| field["key"] == "KEY")\n        .expect("managed KEY field must be visible to the same CLI");\n    assert_eq!(field["secret"], true, "fixture failed to mark KEY secret: {document}");\n\n    // Prove the accepted-run half before the deliberately red dry-run transparency assertion.\n    let uv = sandbox.compile_fake_uv();\n    let capture = sandbox.home.path().join("secret-captured.py");\n    let run = sandbox\n        .command()\n        .env("PATH", uv.parent().unwrap())\n        .env("SKIT_CAPTURE_SCRIPT", &capture)\n        .args(["run", "api", "--set", "KEY=s3cret-value", "--no-input"])\n        .output()\n        .unwrap();\n    assert_success(&["run", "api"], &run);\n    assert!(fs::read_to_string(capture).unwrap().contains("s3cret-value"));\n    let state = sandbox.state_text("api");\n    assert!(!state.contains("s3cret-value"), "secret leaked to state:\\n{state}");\n    assert_eq!(sandbox.value("api", "KEY"), None);\n\n    let dry = sandbox.output(&[\n        "run",\n        "api",\n        "--set",\n        "KEY=s3cret-value",\n        "--dry-run",\n        "--no-input",\n    ]);\n    assert_success(&["run", "api", "--dry-run"], &dry);\n    assert!(!combined(&dry).contains("s3cret-value"), "{}", combined(&dry));\n    assert!(combined(&dry).contains("•••"), "{}", combined(&dry));\n'''
          if old not in s:
              raise SystemExit('secret test block not found exactly')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rustfmt --edition 2024 \
            crates/skit-cli/tests/port_test_run_set.rs \
            crates/skit-cli/tests/port_test_run_set_manifest.rs \
            crates/skit-store/tests/port_test_presets.rs
          git add -- \
            crates/skit-cli/tests/port_test_run_set.rs \
            crates/skit-cli/tests/port_test_run_set_manifest.rs \
            crates/skit-store/tests/port_test_presets.rs
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'test(port): fix and format run-set oracles'
          git push origin HEAD:agent/port-python-test-contracts-v3
