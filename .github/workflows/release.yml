name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the release source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version-line: ${{ steps.version.outputs.line }}
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the package version
        id: version
        shell: bash
        run: |
          package="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "skit-cli-rs") | .version')"
          commit="$(git rev-parse HEAD)"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "line=skit $package (${commit:0:9})" >> "$GITHUB_OUTPUT"
      - name: Compare the tag and package versions
        if: github.event_name == 'push'
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          test "$tag" = "$PACKAGE_VERSION" || { echo "tag $tag does not match package $PACKAGE_VERSION"; exit 1; }
      - name: Run the complete test suite
        run: cargo test --locked --workspace --all-targets --all-features

  linux:
    name: Linux ${{ matrix.target }} (${{ matrix.manylinux }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            manylinux: auto
            runner: ubuntu-22.04
          - target: x86_64
            manylinux: musllinux_1_2
            runner: ubuntu-22.04
          # On an x86_64 runner, maturin-action builds this wheel in its manylinux2014 cross image.
          # The GCC 4.8.5 of that image does not define __ARM_ARCH, so the Arm assembly of ring
          # does not build. On an Arm runner it uses the native PyPA manylinux2014 image (GCC 10)
          # for the same glibc 2.17 target.
          - target: aarch64
            manylinux: auto
            runner: ubuntu-22.04-arm
          - target: aarch64
            manylinux: musllinux_1_2
            runner: ubuntu-22.04
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --locked --release --out dist
          manylinux: ${{ matrix.manylinux }}
          maturin-version: v1.16.0
          rust-toolchain: 1.99.1
      - name: Upload the wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-linux-${{ matrix.target }}-${{ matrix.manylinux }}
          path: dist/
          if-no-files-found: error

  # The linux job cross-builds three of the four wheels on x86_64, so this job installs and runs
  # each wheel on its own platform: an Arm runner for aarch64 and Alpine for musl.
  linux-smoke:
    name: Smoke-test Linux ${{ matrix.target }} (${{ matrix.manylinux }})
    needs: [verify, linux]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            manylinux: auto
            runner: ubuntu-24.04
          - target: aarch64
            manylinux: auto
            runner: ubuntu-24.04-arm
          - target: x86_64
            manylinux: musllinux_1_2
            runner: ubuntu-24.04
          - target: aarch64
            manylinux: musllinux_1_2
            runner: ubuntu-24.04-arm
    env:
      EXPECTED_VERSION_LINE: ${{ needs.verify.outputs.version-line }}
    steps:
      - name: Download the wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels-linux-${{ matrix.target }}-${{ matrix.manylinux }}
          path: dist/
      - name: Install uv for the native Linux smoke test
        if: matrix.manylinux == 'auto'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      - name: Smoke-test the native Linux wheel
        if: matrix.manylinux == 'auto'
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          export UV_TOOL_BIN_DIR="$RUNNER_TEMP/skit-bin"
          uv tool install --force --from "$wheel" skit-cli
          diff <(printf '%s\n' "$EXPECTED_VERSION_LINE") <("$UV_TOOL_BIN_DIR/skit" --version)
          "$UV_TOOL_BIN_DIR/skit" --help >/dev/null
      - name: Smoke-test the musl wheel in Alpine
        if: matrix.manylinux == 'musllinux_1_2'
        shell: bash
        env:
          # uv 0.13.7 on Alpine. The image has no Python, and uv has no musl Python build for
          # aarch64, so the test installs the Python of Alpine, as an Alpine user does.
          UV_ALPINE_IMAGE: ghcr.io/astral-sh/uv:0.13.7-alpine@sha256:a788290ce829958f18bcea1dfd9fb5dcf4bfb22f6380b52c9322f9d91e86b117
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          docker run --rm -v "$PWD/dist:/dist:ro" -v "$RUNNER_TEMP/out:/out" "$UV_ALPINE_IMAGE" sh -euc '
            apk add --no-cache python3 > /dev/null
            wheel="$(find /dist -maxdepth 1 -name "*.whl" | head -n 1)"
            UV_TOOL_BIN_DIR=/opt/skit-bin uv tool install --from "$wheel" skit-cli
            /opt/skit-bin/skit --version > /out/version
            /opt/skit-bin/skit --help > /dev/null
          '
          diff <(printf '%s\n' "$EXPECTED_VERSION_LINE") "$RUNNER_TEMP/out/version"

  windows:
    name: Windows ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x64
          - runner: windows-11-arm
            target: aarch64
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --locked --release --out dist
          maturin-version: v1.16.0
          rust-toolchain: 1.99.1
      - name: Install uv for the native Windows smoke test
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      - name: Smoke-test the native Windows wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist -Filter *.whl | Select-Object -First 1
          $env:UV_TOOL_BIN_DIR = Join-Path $env:RUNNER_TEMP 'skit-bin'
          uv tool install --force --from $wheel.FullName skit-cli
          $skit = Join-Path $env:UV_TOOL_BIN_DIR 'skit.exe'
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'skit-cli-rs').version
          $commit = (git rev-parse HEAD).Substring(0, 9)
          $expected = "skit $version ($commit)"
          $actual = @(& $skit --version)
          if ($LASTEXITCODE -ne 0 -or $actual.Count -ne 1 -or $actual[0] -cne $expected) {
            throw "skit --version printed '$actual', expected '$expected'"
          }
          & $skit --help > $null
      - name: Upload the wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --locked --release --out dist
          maturin-version: v1.16.0
          rust-toolchain: 1.99.1
      - name: Install uv for the native macOS smoke test
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      - name: Smoke-test the native macOS wheel
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          export UV_TOOL_BIN_DIR="$RUNNER_TEMP/skit-bin"
          uv tool install --force --from "$wheel" skit-cli
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "skit-cli-rs") | .version')"
          commit="$(git rev-parse HEAD)"
          diff <(printf 'skit %s (%s)\n' "$version" "${commit:0:9}") <("$UV_TOOL_BIN_DIR/skit" --version)
          "$UV_TOOL_BIN_DIR/skit" --help >/dev/null
      - name: Upload the wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  sdist:
    name: Source archive
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the source archive
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
          maturin-version: v1.16.0
          rust-toolchain: 1.99.1
      - name: Upload the source archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: dist/
          if-no-files-found: error

  verify-artifacts:
    name: Verify the complete distribution set
    needs: [linux, linux-smoke, windows, macos, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Download all distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true
      - name: Verify every wheel and the source archive
        shell: bash
        run: |
          wheel_count="$(find dist -maxdepth 1 -name '*.whl' | wc -l)"
          sdist_count="$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)"
          test "$wheel_count" -eq 8
          test "$sdist_count" -eq 1
          while IFS= read -r wheel; do
            unzip -t "$wheel"
            unzip -Z1 "$wheel" | grep -Eq '[.]dist-info/METADATA$'
            unzip -Z1 "$wheel" | grep -Eq '[.]data/scripts/skit([.]exe)?$'
          done < <(find dist -maxdepth 1 -name '*.whl' -print | sort)
          archive="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          archive_files="$(tar -tzf "$archive")"
          grep -Eq '/Cargo[.]lock$' <<<"$archive_files"
          grep -Eq '/skills/skit/SKILL[.]md$' <<<"$archive_files"
          grep -Eq '/tests/corpus/' <<<"$archive_files"

  publish:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: pypi
      url: https://pypi.org/p/skit-cli
    permissions:
      id-token: write
    steps:
      - name: Download all distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true
      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
