name: Release

# Triggered by pushing a vX.Y.Z tag: build → verify → publish to PyPI via
# Trusted Publisher (OIDC). No PyPI token needed; the trust relationship is bound
# in the PyPI project settings as "repo + workflow + environment".
on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14.6"
          enable-cache: false

      - name: Verify tag matches project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          proj="$(uv version --short)"
          echo "tag=$tag project=$proj"
          if [ "$tag" != "$proj" ]; then
            echo "::error::Tag v$tag does not match pyproject version $proj"
            exit 1
          fi

      - name: Run test suite
        run: uv sync --dev && uv run pytest -q

      - name: Build sdist + wheel
        run: uv build

      - name: Check metadata with twine
        run: uvx twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/skit-cli
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
