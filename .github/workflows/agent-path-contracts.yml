name: Python contract ports

on:
  push:
    branches:
      - agent/port-python-test-contracts

permissions: {}

concurrency:
  group: python-contract-ports
  cancel-in-progress: true

jobs:
  contract-ports:
    if: github.ref == 'refs/heads/agent/port-python-test-contracts'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Format the Rust workspace
        run: cargo fmt --all
      - name: Run the argparse contracts
        run: cargo test --locked -p skit-language --test port_test_argspec -- --nocapture
      - name: Run the Click and Typer contracts
        run: cargo test --locked -p skit-language --test port_test_argspec_click_typer -- --nocapture
      - name: Publish exact rustfmt output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/skit-language/tests/port_test_argspec.rs
          git add crates/skit-language/tests/port_test_argspec_click_typer.rs
          git commit -m "style: format argspec contract ports"
          git push origin HEAD:agent/port-python-test-contracts
