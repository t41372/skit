name: Python contract ports

on:
  push:
    branches:
      - agent/port-python-test-contracts

permissions: {}

concurrency:
  group: python-contract-ports
  cancel-in-progress: true

jobs:
  contract-ports:
    if: github.ref == 'refs/heads/agent/port-python-test-contracts'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Apply oracle-backed fixes and register the language tranche
        shell: python
        run: |
          import json
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              source = target.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement site, found {count}")
              target.write_text(source.replace(old, new), encoding="utf-8")

          replace_once(
              "crates/skit-store/src/mutations/registry.rs",
              """/// Identify one metadata file incarnation with values available from one file-system query.
          ///
          /// The file ID rejects replacements. The change time rejects in-place edits that restore the
          /// modification time and file size. The registry modification time keeps the Python row stamp
          /// coherent. Unix and Windows provide all three values. Other targets do not use the shortcut.
          """,
              """/// Identify one metadata file incarnation with stable file-system values.
          ///
          /// Unix file identity and change time reject replacements and in-place edits that restore the
          /// modification time and file size. Stable Rust does not expose those values on Windows, so the
          /// Windows verifier also checks the metadata content hash. The registry modification time keeps
          /// the Python row stamp coherent. Other targets do not use the shortcut.
          """,
          )
          replace_once(
              "crates/skit-store/src/mutations/registry.rs",
              """    #[cfg(windows)]
              fn read(path: &Path) -> Option<Self> {
                  use std::os::windows::fs::MetadataExt as _;
          
                  let metadata = fs::metadata(path).ok()?;
                  if !metadata.is_file() {
                      return None;
                  }
                  Some(Self {
                      platform: \"windows\",
                      file_id: format!(
                          \"{}:{}\",
                          metadata.volume_serial_number()?,
                          metadata.file_index()?
                      ),
                      file_size: metadata.file_size(),
                      registry_mtime_ns: timestamp_ns(metadata.modified().ok()?).ok()?,
                      // Windows file times count 100-nanosecond intervals.
                      modified_ns: i128::from(metadata.last_write_time()) * 100,
                      changed_ns: i128::from(metadata.change_time()) * 100,
                  })
              }
          """,
              """    #[cfg(windows)]
              fn read(path: &Path) -> Option<Self> {
                  use std::os::windows::fs::MetadataExt as _;
          
                  let metadata = fs::metadata(path).ok()?;
                  if !metadata.is_file() {
                      return None;
                  }
                  let canonical_path = path.canonicalize().ok()?;
                  Some(Self {
                      platform: \"windows-content-v1\",
                      file_id: canonical_path.to_string_lossy().into_owned(),
                      file_size: metadata.file_size(),
                      registry_mtime_ns: timestamp_ns(metadata.modified().ok()?).ok()?,
                      // Windows file times count 100-nanosecond intervals. Stable Rust does not expose a
                      // change counter, so `CachedProjection::verify` also compares the content hash.
                      modified_ns: i128::from(metadata.last_write_time()) * 100,
                      changed_ns: 0,
                  })
              }
          """,
          )
          replace_once(
              "crates/skit-store/src/mutations/registry.rs",
              """#[cfg(windows)]
          const fn current_cache_platform() -> &'static str {
              \"windows\"
          }
          """,
              """#[cfg(windows)]
          const fn current_cache_platform() -> &'static str {
              \"windows-content-v1\"
          }
          """,
          )
          replace_once(
              "crates/skit-store/src/mutations/registry.rs",
              """        expected == proof.projection_hash
                      && MetadataFingerprint::read(meta_path).as_ref() == Some(&proof.fingerprint)
              }
          }
          
          fn legacy_metadata_mtime_ns(path: &Path) -> Option<i64> {
          """,
              """        expected == proof.projection_hash
                      && MetadataFingerprint::read(meta_path).as_ref() == Some(&proof.fingerprint)
                      && metadata_hash_matches(meta_path, &proof.metadata_hash)
              }
          }
          
          #[cfg(windows)]
          fn metadata_hash_matches(path: &Path, expected: &str) -> bool {
              fs::read(path)
                  .ok()
                  .is_some_and(|bytes| content_hash(&bytes) == expected)
          }
          
          #[cfg(not(windows))]
          const fn metadata_hash_matches(_path: &Path, _expected: &str) -> bool {
              true
          }
          
          fn legacy_metadata_mtime_ns(path: &Path) -> Option<i64> {
          """,
          )

          replace_once(
              "crates/skit-cli/src/cli.rs",
              """        let probe = SystemProbe;
          let private_uv = managed_uv_path(self.store.data_dir());
          let uv_path = probe
              .find_program(\"uv\")
              .or_else(|| probe.is_executable(&private_uv).then_some(private_uv));
          let uv = match uv_path {
              Some(path) => UvHealth::Found(path.display().to_string()),
              None => UvHealth::Missing,
          };
          """,
              """        let probe = SystemProbe;
          let uv_required = entries.is_empty()
              || entries
                  .iter()
                  .any(|entry| entry.meta.kind.as_str() == \"python\");
          let uv = if uv_required {
              let private_uv = managed_uv_path(self.store.data_dir());
              let uv_path = probe
                  .find_program(\"uv\")
                  .or_else(|| probe.is_executable(&private_uv).then_some(private_uv));
              match uv_path {
                  Some(path) => UvHealth::Found(path.display().to_string()),
                  None => UvHealth::Missing,
              }
          } else {
              UvHealth::NotRequired
          };
          """,
          )
          replace_once(
              "crates/skit-cli/src/cli.rs",
              """        for item in declarations {
              humanln!(\"Parameter: {}\", item.name);
          """,
              """        if declarations.is_empty() {
              humanln!(\"{} has no managed parameters.\", entry.meta.name);
          }
          for item in declarations {
              humanln!(\"Parameter: {}\", item.name);
          """,
          )
          replace_once(
              "crates/skit-i18n/src/lib.rs",
              """    row!(
              \"{} manages its parameters from the script itself — use --manage / --unmanage, or edit the [tool.skit] block.\",
              \"{} 从脚本自身管理参数——请使用 --manage / --unmanage，或直接编辑 [tool.skit] 区块。\",
              \"{} 由腳本自身管理參數——請使用 --manage / --unmanage，或直接編輯 [tool.skit] 區塊。\",
          ),
          """,
              """    row!(
              \"{} has no managed parameters.\",
              \"{} 没有受管理的参数。\",
              \"{} 沒有受管理的參數。\",
          ),
          row!(
              \"{} manages its parameters from the script itself — use --manage / --unmanage, or edit the [tool.skit] block.\",
              \"{} 从脚本自身管理参数——请使用 --manage / --unmanage，或直接编辑 [tool.skit] 区块。\",
              \"{} 由腳本自身管理參數——請使用 --manage / --unmanage，或直接編輯 [tool.skit] 區塊。\",
          ),
          """,
          )
          replace_once(
              "crates/skit-cli/tests/product_contract.rs",
              "fn doctor_keeps_the_v040_fresh_install_uv_check() {",
              "fn doctor_keeps_the_v040_contextual_uv_check() {",
          )
          replace_once(
              "crates/skit-cli/tests/product_contract.rs",
              """    commands
              .command()
              .env(\"PATH\", commands.data.path())
              .args([\"doctor\", \"--json\"])
              .assert()
              .code(1)
              .stdout(predicate::str::contains(\"\\\"uv\\\":null\"));
          """,
              """    commands
              .command()
              .env(\"PATH\", commands.data.path())
              .args([\"doctor\", \"--json\"])
              .assert()
              .success()
              .stdout(predicate::str::contains(\"\\\"uv\\\":null\"));
          """,
          )

          map_path = Path("docs/design/python-test-port-map.json")
          port_map = json.loads(map_path.read_text(encoding="utf-8"))
          if any(row["source"] == "tests/test_langs.py" for row in port_map["modules"]):
              raise SystemExit("tests/test_langs.py already exists in the port map")
          ported = [
              "test_params_exe_prints_plain_message_without_manage_dead_end",
              "test_doctor_missing_uv_pure_exe_library_exits_zero",
              "test_doctor_missing_uv_with_python_entry_exits_one",
              "test_doctor_json_missing_uv_pure_exe_library_exits_zero",
          ]
          deferred_names = [
              "test_every_known_kind_resolves_to_a_complete_spec",
              "test_python_spec_capabilities_and_pinned_store_name",
              "test_exe_and_command_specs_have_no_analysis_capabilities",
              "test_resolving_a_spec_does_not_import_a_language_parser",
              "test_asking_for_a_capability_resolves_it_once",
              "test_without_drops_exactly_the_named_capabilities",
              "test_capabilities_do_not_decide_spec_identity",
              "test_spec_for_unknown_kind_is_none_and_cached",
              "test_stored_name_unknown_kind_falls_back_to_payload",
              "test_unknown_kind_build_command_raises_clean_launch_error",
              "test_unknown_kind_run_entry_raises_before_spawning",
              "test_unknown_kind_describe_returns_template_and_never_raises",
              "test_unknown_kind_never_reports_missing",
              "test_unknown_kind_preflight_still_checks_workdir",
              "test_unknown_kind_script_path_uses_payload_fallback",
              "test_launcher_uv_delegates_follow_patches_on_the_canonical_module",
              "test_plan_without_cli_reader_degrades_to_none_plan",
          ]
          row = {
              "source": "tests/test_langs.py",
              "status": "partial",
              "targets": ["crates/skit-cli/tests/port_test_langs.rs"],
              "ported": ported,
              "deferred": [
                  {
                      "name": name,
                      "reason": "The Rust owner-level equivalent is not mapped yet; this name remains an explicit gap.",
                      "planned_targets": [
                          "crates/skit-domain",
                          "crates/skit-application",
                          "crates/skit-language",
                          "crates/skit-runtime",
                          "crates/skit-store",
                          "crates/skit-cli",
                      ],
                  }
                  for name in deferred_names
              ],
          }
          insert_at = next(
              index
              for index, current in enumerate(port_map["modules"])
              if current["source"] == "tests/test_reconcile.py"
          )
          port_map["modules"].insert(insert_at, row)
          map_path.write_text(
              json.dumps(port_map, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
      - name: Format the workspace
        run: cargo fmt --all
      - name: Run registry cache correctness tests
        run: cargo test --locked -p skit-store --test registry_fast_read -- --nocapture
      - name: Run contextual uv and executable parameter ports
        run: cargo test --locked -p skit-cli-rs --test port_test_langs -- --nocapture
      - name: Run corrected product and health contracts
        run: |
          cargo test --locked -p skit-cli-rs --test product_contract doctor_keeps_the_v040_contextual_uv_check -- --nocapture
          cargo test --locked -p skit-cli-rs shared_health_inspector_reports_typed_entry_runner_and_rebuild_facts -- --nocapture
      - name: Run the argparse contracts
        run: cargo test --locked -p skit-language --test port_test_argspec -- --nocapture
      - name: Run the Click and Typer contracts
        run: cargo test --locked -p skit-language --test port_test_argspec_click_typer -- --nocapture
      - name: Check i18n and the machine-readable port map
        run: |
          cargo test --locked -p skit-i18n --test catalog -- --nocapture
          cargo test --locked -p skit-cli-rs --test python_port_manifest -- --nocapture
      - name: Publish the verified oracle fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/skit-store/src/mutations/registry.rs
          git add crates/skit-cli/src/cli.rs
          git add crates/skit-cli/tests/product_contract.rs
          git add crates/skit-cli/tests/port_test_langs.rs
          git add crates/skit-i18n/src/lib.rs
          git add docs/design/python-test-port-map.json
          git commit -m "fix: restore Python language and health contracts"
          git push origin HEAD:agent/port-python-test-contracts
