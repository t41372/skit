name: Python contract ports

on:
  push:
    branches:
      - agent/port-python-test-contracts

permissions: {}

concurrency:
  group: python-contract-ports
  cancel-in-progress: true

jobs:
  contract-ports:
    if: github.ref == 'refs/heads/agent/port-python-test-contracts'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run the argparse contracts
        run: cargo test --locked -p skit-language --test port_test_argspec -- --nocapture
      - name: Run the Click and Typer contracts
        run: cargo test --locked -p skit-language --test port_test_argspec_click_typer -- --nocapture
      - name: Check the machine-readable port map
        run: cargo test --locked -p skit-cli-rs --test python_port_manifest -- --nocapture
      - name: Run the existing path contracts
        run: |
          cargo test --locked -p skit-cli-rs --test port_test_path_type -- --nocapture
          cargo test --locked -p skit-tui --test port_test_path_type_tui -- --nocapture
