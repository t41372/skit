name: Reconcile edit oracle probe

on:
  pull_request:
    paths:
      - .github/workflows/reconcile-edit-oracle-probe.yml
      - crates/skit-cli/tests/port_test_reconcile_edit.rs

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run reconcile edit oracle
        shell: bash
        run: |
          set +e
          cargo test --locked -p skit-cli-rs --test port_test_reconcile_edit -- --nocapture
          rc=$?
          echo "RECONCILE_EDIT_ORACLE_RC=$rc"
          exit 0
