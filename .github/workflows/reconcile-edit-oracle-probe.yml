name: Reconcile edit oracle probe

on:
  pull_request:
    paths:
      - .github/workflows/reconcile-edit-oracle-probe.yml
      - crates/skit-cli/tests/port_test_reconcile_edit.rs
      - crates/skit-cli/tests/port_test_params_edit_declared.rs
      - crates/skit-cli/tests/port_test_declared_params_cli.rs
      - crates/skit-cli/tests/port_test_declared_params_runtime.rs
      - crates/skit-cli/tests/port_test_declared_warning_codes.rs
      - crates/skit-cli/tests/port_test_declared_params_manifest.rs
      - crates/skit-cli/tests/port_test_params_edit_bool_pipeline.rs
      - crates/skit-cli/tests/port_test_strength_gate.rs
      - crates/skit-language/tests/port_test_reconcile.rs
      - crates/skit-domain/tests/port_test_declared_params.rs
      - crates/skit-domain/tests/port_test_declared_meta.rs
      - crates/skit-form/tests/port_test_declared_form.rs
      - crates/skit-form/tests/port_test_declared_form_edges.rs
      - crates/skit-application/tests/port_test_declared_delivery.rs
      - crates/skit-runtime/tests/port_test_declared_runtime_wiring.rs

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run relocated and declared edit oracles
        shell: bash
        run: |
          set +e
          cargo test --locked -p skit-domain --test port_test_declared_params -- --nocapture
          echo "DECLARED_PARAMS_DOMAIN_RC=$?"
          cargo test --locked -p skit-domain --test port_test_declared_meta -- --nocapture
          echo "DECLARED_META_RC=$?"
          cargo test --locked -p skit-form --test port_test_declared_form -- --nocapture
          echo "DECLARED_FORM_RC=$?"
          cargo test --locked -p skit-form --test port_test_declared_form_edges -- --nocapture
          echo "DECLARED_FORM_EDGES_RC=$?"
          cargo test --locked -p skit-application --test port_test_declared_delivery -- --nocapture
          echo "DECLARED_DELIVERY_RC=$?"
          cargo test --locked -p skit-runtime --test port_test_declared_runtime_wiring -- --nocapture
          echo "DECLARED_RUNTIME_WIRING_RC=$?"
          cargo test --locked -p skit-language --test port_test_reconcile -- --nocapture
          echo "RECONCILE_LANGUAGE_RC=$?"
          cargo test --locked -p skit-cli-rs --test port_test_strength_gate -- --nocapture
          echo "PARITY_STRENGTH_GATE_RC=$?"
          cargo test --locked -p skit-cli-rs --test port_test_declared_params_manifest -- --nocapture
          echo "DECLARED_PARAMS_MANIFEST_RC=$?"
          cargo test --locked -p skit-cli-rs --test port_test_reconcile_edit -- --nocapture
          echo "RECONCILE_EDIT_ORACLE_RC=$?"
          cargo test --locked -p skit-cli-rs --test port_test_params_edit_declared -- --nocapture
          echo "PARAMS_EDIT_DECLARED_RC=$?"
          cargo test --locked -p skit-cli-rs --test port_test_declared_params_cli -- --nocapture
          echo "DECLARED_PARAMS_CLI_RC=$?"
          cargo test --locked -p skit-cli-rs --test port_test_declared_params_runtime -- --nocapture
          echo "DECLARED_PARAMS_RUNTIME_RC=$?"
          cargo test --locked -p skit-cli-rs --test port_test_declared_warning_codes -- --nocapture
          echo "DECLARED_WARNING_CODES_RC=$?"
          cargo test --locked -p skit-cli-rs --test port_test_params_edit_bool_pipeline -- --nocapture
          echo "PARAMS_EDIT_BOOL_PIPELINE_RC=$?"
          exit 0
