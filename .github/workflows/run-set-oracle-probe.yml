name: Run-set oracle probe

on:
  pull_request:
    paths:
      - .github/workflows/run-set-oracle-probe.yml
      - crates/skit-cli/tests/port_test_run_set.rs
      - crates/skit-cli/tests/port_test_run_set_manifest.rs
      - crates/skit-cli/tests/port_test_raw.rs
      - crates/skit-cli/tests/port_test_raw_manifest.rs
      - crates/skit-cli/tests/port_test_show.rs
      - crates/skit-cli/tests/port_test_show_manifest.rs
      - crates/skit-cli/tests/port_test_strength_gate.rs
      - crates/skit-store/tests/port_test_presets.rs
      - crates/skit-store/tests/port_test_presets_manifest.rs

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run run-set, preset, raw, and show port oracles
        shell: bash
        run: |
          set +e
          rustfmt --edition 2024 --check \
            crates/skit-cli/tests/port_test_run_set.rs \
            crates/skit-cli/tests/port_test_run_set_manifest.rs \
            crates/skit-cli/tests/port_test_raw.rs \
            crates/skit-cli/tests/port_test_raw_manifest.rs \
            crates/skit-cli/tests/port_test_show.rs \
            crates/skit-cli/tests/port_test_show_manifest.rs \
            crates/skit-store/tests/port_test_presets.rs \
            crates/skit-store/tests/port_test_presets_manifest.rs
          echo "PORT_RUSTFMT_RC=$?"
          cargo test --locked -p skit-cli-rs --test port_test_run_set_manifest -- --nocapture
          echo "RUN_SET_MANIFEST_RC=$?"
          cargo test --locked -p skit-cli-rs --test port_test_raw_manifest -- --nocapture
          echo "RAW_MANIFEST_RC=$?"
          cargo test --locked -p skit-cli-rs --test port_test_show_manifest -- --nocapture
          echo "SHOW_MANIFEST_RC=$?"
          cargo test --locked -p skit-store --test port_test_presets_manifest -- --nocapture
          echo "PRESETS_MANIFEST_RC=$?"
          cargo test --locked -p skit-cli-rs --test port_test_strength_gate -- --nocapture
          echo "STRENGTH_GATE_RC=$?"
          cargo test --locked -p skit-cli-rs --test port_test_run_set -- --nocapture --test-threads=1
          echo "RUN_SET_ORACLE_RC=$?"
          cargo test --locked -p skit-store --test port_test_presets -- --nocapture --test-threads=1
          echo "PRESETS_ORACLE_RC=$?"
          cargo test --locked -p skit-cli-rs --test port_test_raw -- --nocapture --test-threads=1
          echo "RAW_ORACLE_RC=$?"
          cargo test --locked -p skit-cli-rs --test port_test_show -- --nocapture --test-threads=1
          echo "SHOW_ORACLE_RC=$?"
          exit 0
