name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: format, lint, and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps
      - name: Check the i18n and CLI contracts
        run: cargo test --locked -p skit-i18n -p skit-cli-rs
      - name: Check repository tooling contracts
        shell: bash
        run: |
          bash scripts/test_tooling_contracts.sh
          bash scripts/test_english.sh
          bash scripts/check_english.sh
          bash benchmarks/test.sh
      - name: Refuse Python implementation files
        shell: bash
        run: |
          tracked="$(
            while IFS= read -r path; do
              test -f "$path" || continue
              case "$path" in
                tests/corpus/* | docs/assets/demo/scripts/* | benchmarks/fixtures/noop.py) continue ;;
              esac
              printf '%s\n' "$path"
            done < <(git ls-files '*.py')
          )"
          test -z "$tracked" || { echo "$tracked"; exit 1; }

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python 3.13 for benchmark source validation
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install Node.js for JavaScript runtime parity
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
      - name: Verify the Node.js runtime
        run: node --version
      - name: Require the Node.js runtime owners
        shell: bash
        run: echo "SKIT_REQUIRE_NODE_RUNTIME=1" >> "$GITHUB_ENV"
      - name: Install Fish for runtime parity
        if: runner.os != 'Windows'
        uses: fish-actions/install-fish@4bb37a71daebb76c6fb7d83771cff31b8a78c28e # v1.2.0
      - name: Require the Fish runtime owner
        if: runner.os != 'Windows'
        shell: bash
        run: echo "SKIT_REQUIRE_FISH_RUNTIME=1" >> "$GITHUB_ENV"
      - name: Run all tests
        run: cargo test --locked --workspace --all-targets --all-features --no-fail-fast
      - name: Run the native Windows uv durability gate
        if: runner.os == 'Windows'
        run: |
          $output = cargo test --locked -p skit-runtime uv::private_tests::test_extract_uv_skips_dir_fsync_on_windows -- --exact --ignored 2>&1
          $output | Write-Output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($output -match '1 passed; 0 failed')) { throw 'the native Windows uv gate ran zero tests' }
      - name: Install the Linux shell matrix
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes zsh
      - name: Run every supported POSIX shell
        if: runner.os == 'Linux'
        shell: bash
        run: |
          output="$(cargo test --locked -p skit-cli-rs --test surface_edges test_the_preamble_runs_on_every_supported_dialect -- --exact --ignored 2>&1)" || {
            status=$?
            printf '%s\n' "$output"
            exit "$status"
          }
          printf '%s\n' "$output"
          grep -Fq '1 passed; 0 failed' <<<"$output" || {
            echo 'the complete POSIX shell gate ran zero tests' >&2
            exit 1
          }
      - name: Compile every Python benchmark subject with CPython 3.13
        shell: bash
        run: |
          output="$(cargo test --locked -p skit-benchmarks --test source_contract test_python_compiles -- --exact --ignored 2>&1)" || {
            status=$?
            printf '%s\n' "$output"
            exit "$status"
          }
          printf '%s\n' "$output"
          grep -Fq '1 passed; 0 failed' <<<"$output" || {
            echo 'the CPython 3.13 compile gate ran zero tests' >&2
            exit 1
          }

  coverage:
    name: coverage (100% executable-source line gate)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none
      - name: Enforce complete line coverage
        shell: bash
        run: |
          bash scripts/test_coverage.sh
          cargo llvm-cov --locked --workspace --all-targets --all-features --lcov --output-path lcov.info
          bash scripts/check_coverage.sh lcov.info
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  supply-chain:
    name: dependency and workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install audit tools
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2,zizmor@1.32.0
      - name: Check dependency policy
        run: cargo deny --locked check
      - name: Check RustSec advisories
        run: cargo audit --deny warnings
      - name: Check GitHub Actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: zizmor .github/workflows .github/actions/install-hyperfine/action.yml

  wheel-smoke:
    name: PyPI and uv tool compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      - name: Build the binary wheel and source archive
        run: uvx --from maturin==1.16.0 maturin build --locked --release --out dist && uvx --from maturin==1.16.0 maturin sdist --out dist
      - name: Install with uv tool
        shell: bash
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "skit-cli-rs") | .version')"
          commit="$(git rev-parse HEAD)"
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          uv tool install --force --from "$wheel" skit-cli
          # A build in a Git checkout names the commit of the checkout.
          diff <(printf 'skit %s (%s)\n' "$version" "${commit:0:9}") <(skit --version)
          sdist="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          uv tool install --force --from "$sdist" skit-cli
          # A build from the source archive names no commit.
          diff <(printf 'skit %s\n' "$version") <(skit --version)
          source_root="$(mktemp -d)"
          tar -xzf "$sdist" -C "$source_root"
          package_root="$(find "$source_root" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          (cd "$package_root" && cargo test --locked -p skit-language --test corpus)
