name: CI

on:
  push:
    branches: [main]
    # Docs/assets never affect the gates below (tests, coverage, and mutation all scope to
    # src/skit) — skip the whole workflow when a change touches nothing but them. The one
    # exception: the Agent Skill's SKILL.md IS gated (test_agent_skill.py enforces the
    # source↔packaged byte sync and resolves every command it teaches), so a skill-only
    # markdown edit must still run CI — hence `paths` with negations, which paths-ignore
    # can't express (later patterns win, so `skills/**` re-includes what `!**.md` dropped).
    paths: ['**', '!**.md', '!docs/**', '!LICENSE', 'skills/**', 'src/skit/skills/**']
  pull_request:
    paths: ['**', '!**.md', '!docs/**', '!LICENSE', 'skills/**', 'src/skit/skills/**']

# Grant no permissions by default; each job requests the minimum it needs
# (zizmor: excessive-permissions).
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# skit is a UTF-8 TUI. Force Python UTF-8 mode everywhere so captured output is
# deterministic across all GitHub-hosted operating systems.
env:
  PYTHONUTF8: "1"

jobs:
  quality:
    name: lint + type check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14.6"
          enable-cache: true
          # v9 changed this default to false; keep the repository's previous cache footprint.
          prune-cache: true
      - name: Sync dependencies
        run: uv sync --dev
      - name: ruff check
        run: uv run ruff check
      - name: ruff format --check
        run: uv run ruff format --check
      - name: ty check
        run: uv run ty check
      - name: i18n catalogs compiled & in sync
        run: |
          uv run python scripts/i18n.py compile
          git diff --exit-code -- '*.mo' \
            || { echo '::error::.mo out of sync with .po — run: uv run python scripts/i18n.py compile'; exit 1; }
      - name: i18n coverage (fresh .pot · every locale 100% · nothing unwrapped)
        run: uv run python scripts/i18n_coverage.py

  test:
    name: pytest (${{ matrix.os }}, py3.14.6)
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14.6"
          enable-cache: true
          prune-cache: true
      - name: Sync dependencies
        run: uv sync --dev
      - name: Run tests
        run: uv run pytest -q --reruns 2 --reruns-delay 1

  coverage:
    name: coverage (100% gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14.6"
          enable-cache: true
          prune-cache: true
      - name: Sync dependencies
        run: uv sync --dev
      # fail_under = 100 is configured in pyproject; anything below exits non-zero.
      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
      # Upload to Codecov even when the 100% gate above fails (!cancelled()), so the dashboard/badge
      # still track the trend; the pytest fail_under gate — not Codecov — is what blocks a merge, so
      # a Codecov outage must never fail CI (fail_ci_if_error: false). Needs a CODECOV_TOKEN secret
      # (repo → Settings → Secrets → Actions); a public repo also falls back to tokenless upload.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  actions-audit:
    name: zizmor (workflow audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14.6"
          enable-cache: true
          prune-cache: true
      - name: Sync dependencies
        run: uv sync --dev
      - name: zizmor
        run: uv run zizmor .github/workflows
