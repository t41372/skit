name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: format, lint, and documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps
      - name: Check the i18n and CLI contracts
        run: cargo test --locked -p skit-i18n -p skit-cli-rs
      - name: Check repository tooling contracts
        shell: bash
        run: |
          bash scripts/test_tooling_contracts.sh
          bash scripts/test_english.sh
          bash scripts/check_english.sh
          bash benchmarks/test.sh
      - name: Refuse Python implementation files
        shell: bash
        run: |
          tracked="$(
            while IFS= read -r path; do
              test -f "$path" || continue
              case "$path" in
                tests/corpus/* | docs/assets/demo/scripts/* | benchmarks/fixtures/noop.py) continue ;;
              esac
              printf '%s\n' "$path"
            done < <(git ls-files '*.py')
          )"
          test -z "$tracked" || { echo "$tracked"; exit 1; }

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run all tests
        run: cargo test --locked --workspace --all-targets --all-features

  coverage:
    name: coverage (100% executable-source line gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-llvm-cov@0.8.7
          fallback: none
      - name: Enforce complete line coverage
        shell: bash
        run: |
          bash scripts/test_coverage.sh
          cargo llvm-cov --locked --workspace --all-targets --all-features --lcov --output-path lcov.info
          bash scripts/check_coverage.sh lcov.info
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  supply-chain:
    name: dependency and workflow audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install audit tools
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2,zizmor@1.29.0
      - name: Check dependency policy
        run: cargo deny --locked check
      - name: Check RustSec advisories
        run: cargo audit --deny warnings
      - name: Check GitHub Actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: zizmor .github/workflows

  wheel-smoke:
    name: PyPI and uv tool compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: false
      - name: Build the binary wheel and source archive
        run: uvx --from maturin==1.14.1 maturin build --locked --release --out dist && uvx --from maturin==1.14.1 maturin sdist --out dist
      - name: Install with uv tool
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          uv tool install --force --from "$wheel" skit-cli
          skit --version
          sdist="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          uv tool install --force --from "$sdist" skit-cli
          skit --version
          source_root="$(mktemp -d)"
          tar -xzf "$sdist" -C "$source_root"
          package_root="$(find "$source_root" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          (cd "$package_root" && cargo test --locked -p skit-language --test corpus)
