name: Format latest parity tests

on:
  pull_request:
    paths:
      - .github/workflows/format-latest-parity-tests.yml
      - crates/skit-cli/tests/port_test_raw.rs
      - crates/skit-cli/tests/port_test_raw_manifest.rs
      - crates/skit-cli/tests/port_test_show.rs
      - crates/skit-cli/tests/port_test_show_manifest.rs

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/port-python-test-contracts-v3
          persist-credentials: true
      - name: Format only latest parity test files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            crates/skit-cli/tests/port_test_raw.rs
            crates/skit-cli/tests/port_test_raw_manifest.rs
            crates/skit-cli/tests/port_test_show.rs
            crates/skit-cli/tests/port_test_show_manifest.rs
          )
          rustfmt --edition 2024 "${files[@]}"
          git add -- "${files[@]}"
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "style(test): format latest parity oracles"
          git push origin HEAD:agent/port-python-test-contracts-v3
