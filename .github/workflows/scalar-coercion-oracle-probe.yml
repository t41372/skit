name: Scalar coercion oracle probe

on:
  pull_request:
    paths:
      - .github/workflows/scalar-coercion-oracle-probe.yml
      - crates/skit-domain/tests/port_test_scalar_coercion.rs

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run scalar coercion oracle
        shell: bash
        run: |
          set +e
          cargo test --locked -p skit-domain --test port_test_scalar_coercion -- --nocapture
          rc=$?
          echo "SCALAR_COERCION_RC=$rc"
          exit 0
