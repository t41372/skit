name: Config scalar oracle probe

on:
  pull_request:
    paths:
      - .github/workflows/config-scalar-oracle-probe.yml
      - crates/skit-store/tests/port_test_config_scalars.rs

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run scalar config oracle
        shell: bash
        run: |
          set +e
          cargo test --locked -p skit-store --test port_test_config_scalars -- --nocapture
          rc=$?
          echo "CONFIG_SCALAR_ORACLE_RC=$rc"
          exit 0
