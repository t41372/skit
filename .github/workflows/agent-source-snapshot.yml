name: Finalize Python test tranche

on:
  pull_request:

permissions: {}

concurrency:
  group: finalize-python-test-tranche-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    name: generate oracle, format, and verify
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/port-python-test-contracts'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the port branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: rewrite
          fetch-depth: 0
          persist-credentials: true
      - name: Check out the pinned Python oracle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 206f9ef946fc45835cb2479593794431f2620c32
          path: oracle
          persist-credentials: false
      - name: Generate the oracle and remove false-complete stubs
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import hashlib
          import json
          import re
          from pathlib import Path

          rewrite = Path("rewrite")
          oracle = Path("oracle")
          oracle_commit = "206f9ef946fc45835cb2479593794431f2620c32"
          offset = 0x6C62272E07BB014262B821756295C58D
          prime = 0x0000000001000000000000000000013B
          mask = (1 << 128) - 1

          def names_digest(names: list[str]) -> str:
              value = offset
              for name in sorted(names):
                  for byte in name.encode() + b"\0":
                      value ^= byte
                      value = (value * prime) & mask
              return f"{value:032x}"

          modules = []
          for path in sorted((oracle / "tests").glob("test_*.py")):
              stem = path.stem
              if re.search(r"_mut(?:_|$)", stem) and stem != "test_mutation_gate":
                  classification = "mutation"
              elif stem.endswith("_cov") or "_cov_" in stem:
                  classification = "coverage"
              else:
                  classification = "behavior"

              source = path.read_bytes()
              tree = ast.parse(source, filename=str(path))
              names = [
                  node.name
                  for node in ast.walk(tree)
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                  and node.name.startswith("test_")
              ]
              modules.append(
                  {
                      "path": path.relative_to(oracle).as_posix(),
                      "class": classification,
                      "source_sha256": hashlib.sha256(source).hexdigest(),
                      "test_count": len(names),
                      "test_names_fnv1a128": names_digest(names),
                  }
              )

          summary = {
              classification: {
                  "modules": sum(
                      module["class"] == classification for module in modules
                  ),
                  "tests": sum(
                      module["test_count"]
                      for module in modules
                      if module["class"] == classification
                  ),
              }
              for classification in ("behavior", "mutation", "coverage")
          }
          inventory = {
              "schema": 1,
              "oracle": {
                  "repository": "t41372/skit",
                  "commit": oracle_commit,
              },
              "summary": summary,
              "modules": modules,
          }
          (rewrite / "docs/design/python-test-oracle.json").write_text(
              json.dumps(inventory, indent=2) + "\n"
          )

          reconcile_path = rewrite / "crates/skit-language/tests/port_test_reconcile.rs"
          reconcile = reconcile_path.read_text()
          deferred = {
              "test_drift_lines_mention_rebind",
              "test_resync_reanchors_rebound_input_order_and_prompt",
              "test_drift_lines_mention_old_and_new_type",
              "test_edit_specs_not_managed_in_secret_warning",
              "test_edit_specs_not_managed_in_no_secret_warning",
              "test_edit_specs_not_managed_in_prompts_warning",
              "test_resync_on_unparseable_script_leaves_definitions_untouched",
              "test_resync_syntax_error_does_not_also_apply_other_edits_incorrectly",
              "test_render_warning_resync_skipped",
              "test_edit_specs_remove_with_duplicate_names_does_not_crash",
              "test_edit_specs_resync_drop_with_duplicate_names_does_not_crash",
              "test_edit_specs_dedups_duplicate_names_even_when_untouched",
              "test_no_secret_also_clears_the_env_source",
          }
          for name in deferred:
              marker = f"fn {name}()"
              position = reconcile.find(marker)
              if position < 0:
                  raise RuntimeError(f"missing deferred stub: {name}")
              start = reconcile.rfind("#[test]", 0, position)
              brace = reconcile.find("{", position)
              depth = 0
              end = None
              for index in range(brace, len(reconcile)):
                  if reconcile[index] == "{":
                      depth += 1
                  elif reconcile[index] == "}":
                      depth -= 1
                      if depth == 0:
                          end = index + 1
                          break
              if start < 0 or end is None:
                  raise RuntimeError(f"could not remove deferred stub: {name}")
              while end < len(reconcile) and reconcile[end] == "\n":
                  end += 1
              reconcile = reconcile[:start] + reconcile[end:]

          old_header = '''//! UNMAPPED: `reconcile.drift_lines`, `reconcile.render_warning`, and `reconcile.edit_specs`
          //! (resync/remove/secret/prompts and their warnings) are higher-level use cases that do NOT exist in
          //! `skit-language`; they live in `skit-cli`/`skit-ui`/`skit-form`, which this integration test cannot
          //! depend on (adding a crate dependency needs a Cargo.toml edit, which is out of scope). Those tests
          //! keep their WHY comment, are marked `#[ignore = "UNMAPPED: ..."]`, and carry a compiling stub.
          '''
          new_header = '''//! This file contains only the 14 executable report-level ports. The 13 higher-layer
          //! `drift_lines`, `render_warning`, and `edit_specs` contracts are recorded as deferred in
          //! `docs/design/python-test-port-map.json`; ignored or compile-only stubs do not count as parity.
          '''
          if old_header not in reconcile:
              raise RuntimeError("reconcile header changed unexpectedly")
          reconcile_path.write_text(reconcile.replace(old_header, new_header, 1))

          token_path = rewrite / "crates/skit-application/tests/port_test_tokens.rs"
          token_source = token_path.read_text()
          token_source = token_source.replace(
              '''//! intentionally requires a `TokenContext`; the one ambient-state test is therefore ported next to
          //! the CLI `token_context()` adapter in `skit-cli/src/run/command.rs`. The other 20 tests exercise
          //! the same scanner through its public deterministic surface here.
          ''',
              '''//! intentionally requires a `TokenContext`; the one ambient-state test is therefore ported as a
          //! black-box CLI test in `port_test_tokens_ambient.rs`. The other 20 tests exercise the same
          //! scanner through its public deterministic surface here.
          ''',
          )
          token_path.write_text(token_source)

          ledger_path = rewrite / "docs/design/python-test-port-ledger.md"
          ledger = ledger_path.read_text()
          ledger = ledger.replace(
              '''Rule: the Python test is the source of truth. A ported test that fails is a finding, not a test to
          weaken. Each failure is adjudicated against the pinned oracle: fix the implementation, or record a
          legitimate architecture difference with oracle evidence. `#[ignore]` is allowed only for a Python
          test that depends on an API that does not exist in the Rust surface (a genuine unmap), never to
          hide a behavior mismatch.
          ''',
              '''Rule: the Python test is the source of truth. A ported test that fails is a finding, not a test to
          weaken. Each failure is adjudicated against the pinned oracle: fix the implementation, or record a
          legitimate architecture difference with oracle evidence. An ignored or compile-only Rust function
          never counts as a port. A genuine architecture gap stays explicit as `deferred` in
          `python-test-port-map.json` until an executable test exists at the owning layer.

          The machine-readable sources of truth are:

          - `python-test-oracle.json`: all 175 Python modules, source hashes, test counts, and test-name
            digests from pinned commit `206f9ef946fc45835cb2479593794431f2620c32`;
          - `python-test-port-map.json`: the exact Rust target and status for each started module;
          - `crates/skit-cli/tests/python_port_manifest.rs`: a gate that rejects incomplete `done` rows,
            unaccounted partial rows, ignored ports, unmapped `port_test_*.rs` files, and missing Rust tests.
          ''',
          )
          ledger = ledger.replace(
              '''The behavior class totals roughly 2,900 tests. The mut/cov classes are not lost: their intent is
          recovered by the Rust coverage and mutation gates (Phase 3), which are the equivalent instruments in
          the Rust toolchain. Any behavioral assertion found only in a mut/cov module is pulled into the
          behavior port of its sibling.
          ''',
              '''The pinned inventory contains exactly 3,018 behavior test definitions, 1,010 mutation test
          definitions, and 578 coverage test definitions. The mut/cov classes are not lost: their intent is
          recovered by the Rust coverage and mutation gates (Phase 3), which are the equivalent instruments in
          the Rust toolchain. Any behavioral assertion found only in a mut/cov module is pulled into the
          behavior port of its sibling.
          ''',
          )
          replacements = {
              "| test_reconcile.py | 27 | crates/skit-language/tests/port_test_reconcile.rs | done (14) · 13 → Tier 4/5 |": "| test_reconcile.py | 27 | crates/skit-language/tests/port_test_reconcile.rs | partial: 14 executable · 13 deferred |",
              "| test_tokens.py | 21 | skit-language | todo |": "| test_tokens.py | 21 | skit-application / skit-cli | done |",
              "| test_hermeticity.py | 1 | skit-store / skit-cli | todo |": "| test_hermeticity.py | 1 | crates/skit-cli/tests/port_test_hermeticity.rs | done |",
              "### test_reconcile.py → port_test_reconcile.rs (14 done · 13 deferred)": "### test_reconcile.py → port_test_reconcile.rs (partial: 14 executable · 13 deferred)",
              "27 ported / 14 passed / 0 failed / 13 `#[ignore]`-UNMAPPED. The 14 that exercise the reconcile\nreport all pass:": "14 ported / 14 passed / 0 failed / 13 explicitly deferred. The deferred tests are recorded in the\nmachine map and no longer exist as ignored stubs, so neither Cargo nor this ledger can misreport them\nas completed. The 14 that exercise the reconcile report all pass:",
              "A `skit-language` integration test cannot reach it without a forbidden dependency\nedit, so those tests carry a compiling `#[ignore]` stub with their WHY comment and move to the tier\nthat owns the code:": "A `skit-language` integration test cannot reach it without reversing crate dependencies. Those\ncontracts remain named, reasoned deferrals in `python-test-port-map.json` and move to the tier that\nowns the code:",
          }
          for old, new in replacements.items():
              if old not in ledger:
                  raise RuntimeError(f"ledger text changed unexpectedly: {old[:60]}")
              ledger = ledger.replace(old, new, 1)

          ledger += '''

          ### test_tokens.py → port_test_tokens.rs + port_test_tokens_ambient.rs (done)

          21 ported / 21 executable / 0 deferred. Twenty deterministic scanner contracts use the public
          `skit_application::tokens` surface one test per Python function. The Python-only implicit
          process-environment and clock default maps to a black-box CLI preview, which exercises the
          `token_context()` adapter where Rust intentionally reads ambient state. Exact error prose, brace modes,
          unknown-token pass-through, current-user tilde behavior, preview argument forwarding, and deep scanner
          advancement are all pinned separately instead of bundled into implementation-shaped tests.

          ### test_hermeticity.py → port_test_hermeticity.rs (done)

          1 ported / 1 executable on POSIX, matching the Python test's Windows skip. The black-box CLI test
          removes all `SKIT_*_DIR` overrides, redirects `HOME`, `USERPROFILE`, and all XDG roots, then performs
          configuration, add, and run transactions. It proves data, state, and configuration writes stay under
          the isolated root even when the primary environment-variable lookup is absent.
          '''
          ledger_path.write_text(ledger)
          PY
      - name: Format the Rust workspace
        working-directory: rewrite
        run: cargo fmt --all
      - name: Verify formatting
        working-directory: rewrite
        run: cargo fmt --all --check
      - name: Run the port-manifest and newly ported contracts
        working-directory: rewrite
        run: |
          cargo test --locked -p skit-application --test port_test_tokens
          cargo test --locked -p skit-language --test port_test_reconcile
          cargo test --locked -p skit-cli-rs \
            --test python_port_manifest \
            --test port_test_tokens_ambient \
            --test port_test_hermeticity
      - name: Commit generated and formatted files
        working-directory: rewrite
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          allowed='^(docs/design/python-test-oracle\.json|docs/design/python-test-port-ledger\.md|crates/skit-language/tests/port_test_reconcile\.rs|crates/skit-application/tests/port_test_tokens\.rs|crates/skit-cli/tests/python_port_manifest\.rs|crates/skit-cli/tests/port_test_tokens_ambient\.rs|crates/skit-cli/tests/port_test_hermeticity\.rs|\.github/workflows/agent-source-snapshot\.yml)$'
          unexpected="$(git status --porcelain | sed 's/^...//' | grep -Ev "$allowed" || true)"
          test -z "$unexpected" || { printf 'Unexpected generated changes:\n%s\n' "$unexpected"; exit 1; }
          git rm .github/workflows/agent-source-snapshot.yml
          git add docs/design/python-test-oracle.json \
            docs/design/python-test-port-ledger.md \
            crates/skit-language/tests/port_test_reconcile.rs \
            crates/skit-application/tests/port_test_tokens.rs \
            crates/skit-cli/tests/python_port_manifest.rs \
            crates/skit-cli/tests/port_test_tokens_ambient.rs \
            crates/skit-cli/tests/port_test_hermeticity.rs
          git commit -m "test: finalize first Python contract tranche"
          git push origin "HEAD:refs/heads/${HEAD_BRANCH}"
