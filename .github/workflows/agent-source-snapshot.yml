name: Agent source snapshot

on:
  pull_request:

permissions: {}

concurrency:
  group: agent-source-snapshot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  snapshot:
    name: export branch source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Create the source archive
        shell: bash
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/skit-source.tar.gz" HEAD
      - name: Upload the source archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-source-snapshot
          path: ${{ runner.temp }}/skit-source.tar.gz
          retention-days: 1
