name: Refresh dependency locks

on:
  pull_request:
    paths:
      - '.github/workflows/refresh-dependencies.yml'
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - name: Install current uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.14.6'
          enable-cache: false
      - name: Setup current Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.5.0'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Use current npm
        run: npm install --global npm@11.17.0
      - name: Refresh Python lock
        run: uv lock --upgrade
      - name: Refresh Rust lock
        run: cargo update
      - name: Refresh docs lock
        working-directory: docs
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfiles
        shell: bash
        run: |
          set -euo pipefail
          git add Cargo.lock uv.lock docs/package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfiles already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: refresh dependency lockfiles'
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
