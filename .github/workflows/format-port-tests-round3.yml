name: Format port tests round 3

on:
  pull_request:
    paths:
      - .github/workflows/format-port-tests-round3.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/port-python-test-contracts-v3
          persist-credentials: true
      - name: Format latest port tests only
        shell: bash
        run: |
          set -euo pipefail
          files=(
            crates/skit-application/tests/port_test_parameter_edit.rs
            crates/skit-runtime/tests/port_test_command_template_quoting.rs
            crates/skit-domain/tests/port_test_scalar_coercion.rs
            crates/skit-store/tests/port_test_config_mirror_axes.rs
          )
          rustfmt --edition 2024 "${files[@]}"
          git add -- "${files[@]}"
          if git diff --cached --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "style(test): format latest port oracles"
          git push origin HEAD:agent/port-python-test-contracts-v3
