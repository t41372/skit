name: Install hyperfine (pinned)
description: >-
  Install hyperfine 2.0.0 from its release archive and verify the fixed SHA-256 digest.
runs:
  using: composite
  steps:
    - name: Download, verify, install
      shell: bash
      run: |
        # A release download can fail for a moment (HTTP 504 on the 2026-11-08 nightly), so curl
        # tries again. The digest check below still decides what gets installed.
        curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 -o hyperfine.tgz \
          "https://github.com/sharkdp/hyperfine/releases/download/v2.0.0/hyperfine-v2.0.0-x86_64-unknown-linux-gnu.tar.gz"
        echo "ae2beda2ac99c098427e4f755244552daf20e514422889cca6d44421e2d93c87  hyperfine.tgz" | sha256sum -c -
        tar xzf hyperfine.tgz
        install -m 0755 hyperfine-v2.0.0-x86_64-unknown-linux-gnu/hyperfine /usr/local/bin/hyperfine
        rm -rf hyperfine.tgz hyperfine-v2.0.0-x86_64-unknown-linux-gnu
        hyperfine --version
