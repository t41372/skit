test_workspace = true
all_features = true
minimum_test_timeout = 20
timeout_multiplier = 3.0


# A mutant inside code this host compiles out can never be killed here. The text changes, the file
# still builds because the item is not compiled, and every test passes, so cargo-mutants reports it
# missed. `current_argument_dialect` is written twice, once per host, and the Windows half is that
# case on a Linux runner. The POSIX half is not a survivor either way: `ArgumentDialect` has no
# `Default`, so mutating it does not build.
exclude_re = ["replace current_argument_dialect"]
