[package]
name = "skit-cli-rs"
description = "Rust composition root and command-line interface for skit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "skit_cli"
path = "src/lib.rs"

[features]
# Keep the benchmark package in the source archive lock graph.
sdist-workspace = ["dep:skit-benchmarks"]

[[bin]]
name = "skit"
path = "src/main.rs"

[dependencies]
clap.workspace = true
clap_complete.workspace = true
dialoguer.workspace = true
ratatui-crossterm.workspace = true
serde.workspace = true
serde_json.workspace = true
rpassword.workspace = true
shlex.workspace = true
thiserror.workspace = true
tempfile.workspace = true
time.workspace = true
toml.workspace = true
unicode-width.workspace = true
skit-application.workspace = true
skit-domain.workspace = true
skit-form.workspace = true
skit-i18n.workspace = true
skit-language.workspace = true
skit-runtime.workspace = true
skit-store.workspace = true
skit-ui.workspace = true
skit-tui.workspace = true
skit-benchmarks = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
fs-id.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
fs_at.workspace = true
predicates.workspace = true
portable-pty.workspace = true
proptest.workspace = true
ratatui-core.workspace = true
sha2.workspace = true
skit-tui-walker-model.workspace = true
skit-tui-walker-support.workspace = true
syn.workspace = true
tempfile.workspace = true
toml_edit.workspace = true
vt100.workspace = true
same-file.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dev-dependencies]
cap-primitives.workspace = true
cap-std.workspace = true
fence-windows.workspace = true
windows-sys.workspace = true

[lints]
workspace = true
