[package]
name = "skit-cli-rs"
description = "Rust composition root and command-line interface for skit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "skit_cli"
path = "src/lib.rs"

[features]
# Keep the benchmark package in the source archive lock graph.
sdist-workspace = ["dep:skit-benchmarks"]

[[bin]]
name = "skit"
path = "src/main.rs"

[dependencies]
clap.workspace = true
clap_complete.workspace = true
serde.workspace = true
serde_json.workspace = true
rpassword.workspace = true
shlex.workspace = true
thiserror.workspace = true
tempfile.workspace = true
time.workspace = true
toml.workspace = true
skit-application.workspace = true
skit-domain.workspace = true
skit-form.workspace = true
skit-i18n.workspace = true
skit-language.workspace = true
skit-runtime.workspace = true
skit-store.workspace = true
skit-ui.workspace = true
skit-tui.workspace = true
skit-benchmarks = { workspace = true, optional = true }

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
portable-pty.workspace = true
syn.workspace = true
tempfile.workspace = true

[lints]
workspace = true
