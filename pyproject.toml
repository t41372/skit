[project]
# The distribution name remains skit-cli. The installed command remains skit.
name = "skit-cli"
version = "0.5.0"
description = "A terminal library and launcher for scripts, prompts, programs, and commands."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yi-Ting Chiu", email = "mytim710@gmail.com" }]
keywords = [
    "script",
    "launcher",
    "uv",
    "tui",
    "ratatui",
    "pep723",
    "script-manager",
    "script-runner",
    "automation",
    "ai-agent",
    "ai-prompt",
    "agent-skills",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]

[project.urls]
Repository = "https://github.com/t41372/skit"
Issues = "https://github.com/t41372/skit/issues"
Documentation = "https://t41372.github.io/skit/"

[build-system]
requires = ["maturin>=1.14.1,<2"]
build-backend = "maturin"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/skit-cli/Cargo.toml"
locked = true
strip = true
include = [{ path = "skills/skit/SKILL.md", format = "sdist" }]
