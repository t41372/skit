# The performance contract (docs/design/benchmarks.md — "Budgets").
#
# tier = "enforced": `benchmarks check` fails on violation. Deterministic or
#   ratchet-safe metrics only; every row carries context = provenance for its bound.
# tier = "target": the aspirational contract — reported on every run, never failing
#   CI until a future PR deliberately moves the row to enforced.
# ratchet = true: the bound derives from a measured value + headroom, and
#   `check --propose` refreshes it. CI artifacts only — propose REFUSES a local or
#   dirty-tree run, because the module census is platform- and python-dependent. It
#   also refuses to widen a bound (that is a regression wearing a ratchet's clothes)
#   unless asked with --allow-regression. Non-ratchet bounds are hand-set contract
#   values that propose leaves alone.
# context.pr / context.commit: where a refreshed bound came from. A PR artifact
#   anchors on the PR number — a PR run's HEAD is GitHub's ephemeral merge ref, which
#   no clone resolves and squash-merge deletes; artifacts off a PR carry the commit.
#
# This file is regenerated by `uv run python -m benchmarks check --propose`; keep
# prose in `note` fields, not comments below this header.

[[budget]]
metric = "footprint.wheel_bytes"
max = 1048576
tier = "enforced"
profiles = [
    "pr",
    "full",
]
note = "1 MiB hand-set contract bound (the wheel measures ~0.5 MiB); catches accidental data shipping"

[budget.context]
commit = "366d6d4"
date = "2026-07-20"

[[budget]]
metric = "imports.version.modules"
max = 165
tier = "enforced"
ratchet = true
headroom = 0.1
note = "ratchet: --version's import graph — the dispatcher answers the flag before importing the CLI, so this is the dispatcher plus the metadata read and nothing else (150 measured + 10% headroom, down from 291)"

[budget.context]
python = "3.13"
pr = "33"
date = "2026-07-26"

[[budget]]
metric = "imports.list_json.n0.modules"
max = 270
tier = "enforced"
ratchet = true
headroom = 0.1
note = "ratchet: list's import graph on an EMPTY library — the CLI floor, no kind resolved (245 measured + 10% headroom, down from 291: the version now resolves lazily and the command bodies import their own dependencies)"

[budget.context]
python = "3.13"
pr = "33"
date = "2026-07-26"

[[budget]]
metric = "imports.list_json.n100.modules"
max = 274
tier = "enforced"
ratchet = true
headroom = 0.1
note = "ratchet: the census a real library actually pays — now only 4 modules above the empty-library floor, because resolving a kind no longer imports that language's grammar (249 measured + 10% headroom, down from 315)"

[budget.context]
python = "3.13"
pr = "33"
date = "2026-07-26"

[[budget]]
metric = "imports.list_json.n100.has_tree_sitter"
max = 0
tier = "enforced"
note = "listing a populated library must not import a grammar. A boolean census fact — enforceable without a ratchet, and NOT pinned to a python version: whether a grammar is imported does not depend on the interpreter, and a pin would turn a CI python bump into a hard failure. The n0 census cannot see this, which is why the row keys on n100"

[budget.context]
pr = "33"
date = "2026-07-25"

