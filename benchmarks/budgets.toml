schema = 1

[[budget]]
metric = "repository.python_implementation_files"
max = 0
tier = "enforced"
note = "The Rust cutover cannot add Python implementation or tooling files."

[[budget]]
metric = "pipeline.skipped_count"
max = 0
tier = "enforced"
note = "The reference pipeline cannot skip a required measurement."

[[budget]]
metric = "binary.release_bytes"
max = 20971520
tier = "enforced"
note = "The stripped release binary cannot exceed 20 MiB."

[[budget]]
metric = "startup.version.mean_ms"
max = 50
tier = "target"
note = "The version command should complete in 50 ms on the reference runner."

[[budget]]
metric = "startup.list_empty.mean_ms"
max = 75
tier = "target"
note = "An empty JSON library read should complete in 75 ms on the reference runner."
